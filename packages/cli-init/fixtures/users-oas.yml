openapi: 3.1.0
info:
  title: Users Preset API
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/1.0.0
    x-service-id: core
x-services:
  - id: core
    name: Core
    kind: core
    url: http://localhost:3000/api/1.0.0
paths:
  /users:
    get:
      tags: [user]
      operationId: listUsers
      summary: List users
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /organizations:
    get:
      tags: [organization]
      operationId: listOrganizations
      summary: List organizations
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
components:
  schemas:
    User:
      type: object
      description: Port output object for User resource.
      x-primary-key: id
      x-service: core
      x-domain: Users
      x-entity: User
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        organization:
          type: string
          format: uuid
          x-relation:
            entity: Organization
            match: id
            display: name
            kind: belongsTo
    Organization:
      type: object
      description: Port output object for Organization resource.
      x-primary-key: id
      x-service: core
      x-domain: Users
      x-entity: Organization
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
