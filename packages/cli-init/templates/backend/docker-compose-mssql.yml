services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aaa-mssql
    environment:
      ACCEPT_EULA: 'Y'
      # SQL Server rejects a password that is not complex enough and the
      # container then exits, so this default carries an uppercase letter, a
      # digit and a symbol. With the old one the container never started, and
      # the MSSQL smoke test had therefore never run at all.
      MSSQL_SA_PASSWORD: '${JUMENTIX_MSSQL_SA_PASSWORD:-${AAA_MSSQL_SA_PASSWORD:-Change_me_mssql_password_1}}' 
    ports:
      - '1433:1433'
    healthcheck:
      test:
        - CMD-SHELL
        - '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1'
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data:
