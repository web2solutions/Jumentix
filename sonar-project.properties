sonar.organization=web2solutions
sonar.projectKey=web2solutions_Jumentix
sonar.projectName=Jumentix
sonar.sourceEncoding=UTF-8

sonar.sources=apps,packages,ci-cd
sonar.tests=apps/backend-template/test,packages
# Cypress helpers (harness.ts, support) are instruments, not subjects. Without
# this, Sonar treated packages/*/cypress/harness.ts as source at 0% and dragged
# Coverage on New Code below the gate while the real cana report sat at 99%.
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.cy.ts,**/cypress/**/*

sonar.exclusions=**/node_modules/**,**/.build/**,**/dist/**,**/.serverless/**,**/coverage/**,**/.browser-tests/**,**/*.d.ts,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.webp,**/*.avif,**/*.woff,**/*.woff2,**/*.ttf,**/*.eot,apps/service-management/**,apps/jumentix-website/**,apps/backend-template/OASdoc/**,**/docker/**,**/AsyncAPIdoc/**,sdk-clients/**,documentation/**,spec/**

# Coverage exclusions: what the measured reports do not claim to cover.
#
# Sonar treats a source file absent from lcov as 0% covered. That is the right
# default — it is how an untested module gets noticed — but it makes the number
# meaningless when the report was never scoped to the file in the first place.
#
# Every entry below is a promise to be broken. Requirement 112 gives each
# package and app its own suite at the project's 99% standard; as each one lands,
# its entry comes out of this list and its own report starts feeding Sonar. An
# entry that is still here once its package has a suite is a stale exemption, and
# `bun run packages:check-suites` fails on exactly that.
#
# `packages/cana` is NOT listed here: browser coverage is written to
# coverage/browser/lcov.info and included in sonar.javascript.lcov.reportPaths.

# --- Workspace packages without their own suite yet (Requirement 112) ---
sonar.coverage.exclusions=\
  ci-cd/check-fail-closed.js,\
  packages/config-eslint/**,\
  packages/config-jest/**,\
  packages/config-ts/**,\
  apps/jumentix-website/**,\
  ci-cd/**

# `ci-cd/check-fail-closed.js` is listed above for a different reason: it is an
# integration harness that spawns the gates as subprocesses, including
# `test:unit`. Running it under jest would be recursive. Its pure parts
# (resolveBunBinary, summarize) are tested in ci-cd/test/.
#
# `ci-cd/**` is excluded wholesale here because `jest.config.js` measures only a
# named allowlist of those files. The two lists are kept in step by
# `check-coverage-scope`, so a file opted into one and not the other fails.

sonar.cpd.exclusions=apps/backend-template/src/infra/**/*,**/test/**/*,**/cypress/**/*

# Jest unit/integration LCOV + browser LCOV for packages/cana (Req 112 §4).
# coverage/frontend/lcov.info: apps/frontend under bun:test (unit + component), JUM-776.
sonar.javascript.lcov.reportPaths=./coverage/lcov.info,./coverage/browser/lcov.info,./coverage/frontend/lcov.info
