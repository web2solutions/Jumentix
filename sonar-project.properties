sonar.organization=xpertminds
sonar.projectKey=XpertMinds_Jumentix
sonar.projectName=Jumentix

sonar.sources=apps,packages,ci-cd
sonar.tests=apps/backend-template/test
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

sonar.exclusions=**/node_modules/**,**/.build/**,**/dist/**,**/.serverless/**,**/coverage/**,**/*.d.ts,apps/service-management/**,**/docker/**,**/AsyncAPIdoc/**,sdk-clients/**,documentation/**,spec/**
# ci-cd/check-fail-closed.js is an integration harness: it spawns the gates as
# subprocesses, including test:unit. Running it under jest would be recursive,
# so its orchestration is deliberately not unit-covered. Its pure parts
# (resolveBunBinary, summarize) are tested in test/unit/ci-cd/.
sonar.coverage.exclusions=ci-cd/check-fail-closed.js

sonar.cpd.exclusions=apps/backend-template/src/infra/**/*,**/test/**/*

# JavaScript/TypeScript coverage report (LCOV)
sonar.javascript.lcov.reportPaths=./coverage/lcov.info
