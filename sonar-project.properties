sonar.organization=xpertminds
sonar.projectKey=XpertMinds_Jumentix
sonar.projectName=Jumentix

sonar.sources=apps,packages,ci-cd
sonar.tests=apps/backend-template/test
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

sonar.exclusions=**/node_modules/**,**/.build/**,**/dist/**,**/.serverless/**,**/coverage/**,**/*.d.ts,apps/service-management/**,**/docker/**,**/AsyncAPIdoc/**,sdk-clients/**,documentation/**,spec/**

# Coverage exclusions: what `coverage/lcov.info` does not measure.
#
# Sonar treats a source file absent from the lcov as 0% covered. That is the
# right default — it is how an untested module gets noticed — but it makes the
# number meaningless when the report was never scoped to the file in the first
# place. Before this list, Sonar reported 46.3% coverage for a project whose
# measured scope sits at 99.0%, and the difference was entirely files this
# report does not claim to cover.
#
# Every entry below is a promise to be broken. Requirement 112 gives each
# package and app its own suite at the project's 99% standard; as each one lands,
# its entry comes out of this list and its own report starts feeding Sonar. An
# entry that is still here once its package has a suite is a stale exemption, and
# `bun run packages:check-suites` fails on exactly that.

# --- Workspace packages without their own suite yet (Requirement 112) ---
# These are imported by the backend's tests through the `@jumentix/*` aliases,
# so they do execute — but attributing that to the package is the coupling
# Requirement 112 exists to end. A package's coverage must come from its own
# suite, or it is measuring the backend, not the library.
sonar.coverage.exclusions=\
  ci-cd/check-fail-closed.js,\
  packages/adapter-runtime-bootstrap/**,\
  packages/database-client-factory/**,\
  packages/external-db-repositories/**,\
  packages/external-persistence-core/**,\
  packages/external-store-proxy/**,\
  packages/key-value-storage/**,\
  packages/message-mediator/**,\
  packages/mutex-service/**,\
  packages/persistence-contracts/**,\
  packages/runtime-infra/**,\
  packages/sdk-grpc-client/**,\
  packages/sdk-rest-client/**,\
  packages/sdk-websocket-client/**,\
  packages/cli-init/**,\
  packages/config-eslint/**,\
  packages/config-jest/**,\
  packages/config-ts/**,\
  packages/security-scanner/**,\
  packages/shared-contracts/**,\
  apps/jumentix-website/**,\
  ci-cd/**

# `ci-cd/check-fail-closed.js` is listed above for a different reason: it is an
# integration harness that spawns the gates as subprocesses, including
# `test:unit`. Running it under jest would be recursive. Its pure parts
# (resolveBunBinary, summarize) are tested in test/unit/ci-cd/.
#
# `ci-cd/**` is excluded wholesale here because `jest.config.js` measures only a
# named allowlist of those files. The two lists are kept in step by
# `check-coverage-scope`, so a file opted into one and not the other fails.

sonar.cpd.exclusions=apps/backend-template/src/infra/**/*,**/test/**/*

# JavaScript/TypeScript coverage report (LCOV)
sonar.javascript.lcov.reportPaths=./coverage/lcov.info
