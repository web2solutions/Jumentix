version: 2.1

orbs:
  codecov: codecov/codecov@4.1.0

jobs:
  test-source:
    docker:
      # Official Bun image at the pinned version. The previous `cimg/node:22.23`
      # plus `npx pnpm@9.15.3` bootstrap depended on npm *and* pnpm to install
      # anything — two package managers to get to a third. Requirement 096 §1.
      - image: oven/bun:1.3.14
      - image: redis:latest
        environment:
          REDIS_ARGS: "--sysctl vm.overcommit_memory=1"
        command: redis-server --save 20 1 --loglevel warning
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-v1-{{ .Branch }}-{{checksum "bun.lock"}}
            - bun-cache-v1-{{ .Branch }}
      - run:
          name: Assert the pinned Bun toolchain
          command: bun ci-cd/check-bun-version.js
      - run:
          name: install packages
          # Frozen, unlike the previous --no-frozen-lockfile: CI must not resolve
          # versions the lockfile never recorded (Requirement 096 §2).
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-deps-v1-{{ .Branch }}-{{checksum "bun.lock"}}
          paths:
            - node_modules
      - save_cache:
          key: bun-cache-v1-{{ .Branch }}
          paths:
            - ~/.bun/install/cache
      - run:
          name: Install dockerize
          command: wget https://github.com/jwilder/dockerize/releases/download/$DOCKERIZE_VERSION/dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz && sudo tar -C /usr/local/bin -xzvf dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz && rm dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz
          environment:
            DOCKERIZE_VERSION: v0.6.1
      - run:
          name: Wait for Redis
          command: dockerize -wait tcp://localhost:6379 -timeout 1m
      - run:
          name: Run branch-aware quality gate
          # Private agent-registry (Req 089): project must expose AGENT_REGISTRY_TOKEN
          # and/or GH_TOKEN / GITHUB_TOKEN with contents:read on
          # XpertMinds/jumentix-agent-registry. Default github tokens cannot read it.
          command: |
            export GH_TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-${AGENT_REGISTRY_TOKEN:-}}}"
            JUMENTIX_QUALITY_GATE_TARGET=${CIRCLE_BRANCH:-dev} \
              AAA_CI_GATE_RESULT_FILE=artifacts/ci/branch-quality-gate.json \
              AAA_CI_MATRIX_RESULT_FILE=artifacts/ci/full-test-matrix.json \
              bun run ci:gate:branch
      - store_artifacts:
          path: artifacts/ci/branch-quality-gate.json
          destination: branch-quality-gate.json
      - codecov/upload:
          commit_args: "--slug XpertMinds/Jumentix"
          report_args: "--slug XpertMinds/Jumentix"
          upload_args: "--slug XpertMinds/Jumentix --fail-on-error"

workflows:
  test-source:
    jobs:
      - test-source:
          filters:
            branches:
              only:
                - dev
                - main
