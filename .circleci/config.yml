version: 2.1

executors:
  node_bun:
    docker:
      - image: cimg/node:22.21
    environment:
      BUN_VERSION: 1.3.13
      JUMENTIX_CI_GATE_RESULT_FILE: artifacts/ci/branch-quality-gate.json
      JUMENTIX_CI_MATRIX_RESULT_FILE: artifacts/ci/full-test-matrix.json
      JUMENTIX_FULL_MATRIX_SKIP_CELLS: workspace-builds,workspace-tests,website-prepublish,integration
      AAA_JWT_TOKEN_SECRET_KEY: ci_jwt_secret_key
  # JUM-875: jobs whose tests dial 127.0.0.1 cannot use remote Docker
  # (published ports live on the remote host). Secondary containers share
  # localhost with the primary container on the Docker executor.
  node_bun_services:
    docker:
      - image: cimg/node:22.21
      - image: redis:7.2-alpine
      - image: rabbitmq:3.13-alpine
    environment:
      BUN_VERSION: 1.3.13
      JUMENTIX_CI_GATE_RESULT_FILE: artifacts/ci/branch-quality-gate.json
      JUMENTIX_CI_MATRIX_RESULT_FILE: artifacts/ci/full-test-matrix.json
      JUMENTIX_FULL_MATRIX_SKIP_CELLS: workspace-builds,workspace-tests,website-prepublish,integration
      AAA_JWT_TOKEN_SECRET_KEY: ci_jwt_secret_key

commands:
  prepare_checkout:
    steps:
      - run:
          name: Checkout repository over public HTTPS
          command: |
            set -euo pipefail
            repository_url="https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            git clone --filter=blob:none "$repository_url" .
            git checkout "${CIRCLE_SHA1}"
      - run:
          name: Fetch branch references
          command: git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
            echo 'export PATH="$HOME/.bun/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install frozen dependencies
          command: |
            source "$BASH_ENV"
            bun ci-cd/check-bun-version.js
            bun install --frozen-lockfile
            bun run compat:check-node-version
  resolve_pr_metadata:
    steps:
      - run:
          name: Resolve pull request metadata
          command: |
            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              {
                echo "export AAA_CI_IS_PULL_REQUEST=0"
                echo "export JUMENTIX_CI_IS_PULL_REQUEST=0"
                echo "export JUMENTIX_QUALITY_GATE_TARGET=${CIRCLE_BRANCH:-dev}"
                echo "export JUMENTIX_PR_HEAD_REF=${CIRCLE_BRANCH:-}"
                echo "export AAA_PR_HEAD_REF=${CIRCLE_BRANCH:-}"
              } >> "$BASH_ENV"
              exit 0
            fi

            PR_NUMBER="${CIRCLE_PULL_REQUEST##*/}"
            REPO="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            node - "$REPO" "$PR_NUMBER" >> "$BASH_ENV" \<<'NODE'
            const [repo, number] = process.argv.slice(2);
            const url = `https://api.github.com/repos/${repo}/pulls/${number}`;
            const response = await fetch(url, {
              headers: { accept: 'application/vnd.github+json' }
            });
            if (!response.ok) {
              throw new Error(`failed to resolve PR metadata: ${response.status} ${response.statusText}`);
            }
            const pr = await response.json();
            const quote = (value) => JSON.stringify(String(value || ''));
            console.log('export AAA_CI_IS_PULL_REQUEST=1');
            console.log('export JUMENTIX_CI_IS_PULL_REQUEST=1');
            console.log(`export JUMENTIX_PR_BASE_REF=${quote(pr.base?.ref)}`);
            console.log(`export AAA_PR_BASE_REF=${quote(pr.base?.ref)}`);
            console.log(`export JUMENTIX_QUALITY_GATE_TARGET=${quote(pr.base?.ref)}`);
            console.log(`export JUMENTIX_PR_HEAD_REF=${quote(pr.head?.ref)}`);
            console.log(`export AAA_PR_HEAD_REF=${quote(pr.head?.ref)}`);
            console.log(`export JUMENTIX_PR_TITLE=${quote(pr.title)}`);
            console.log(`export AAA_PR_TITLE=${quote(pr.title)}`);
            console.log(`export JUMENTIX_PR_BODY=${quote(pr.body)}`);
            console.log(`export AAA_PR_BODY=${quote(pr.body)}`);
            NODE
  require_ci_job:
    parameters:
      job:
        type: string
    steps:
      - run:
          name: Classify CI context for << parameters.job >>
          command: |
            source "$BASH_ENV"
            set +e
            node ci-cd/classify-ci-context.js \
              --result-file artifacts/ci/ci-context.json \
              --require-job << parameters.job >>
            status="$?"
            set -e
            if [ "$status" = "78" ]; then
              circleci-agent step halt
              exit 0
            fi
            exit "$status"
  wait_for_services:
    steps:
      - run:
          name: Wait for Redis and RabbitMQ service containers
          command: |
            for attempt in $(seq 1 30); do
              if (echo > /dev/tcp/127.0.0.1/6379) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/5672) 2>/dev/null; then
                echo "Redis and RabbitMQ are accepting connections."
                exit 0
              fi
              sleep 2
            done
            echo "Service containers did not become ready." >&2
            exit 1

jobs:
  branch-gate:
    executor: node_bun
    steps:
      - prepare_checkout
      - resolve_pr_metadata
      - require_ci_job:
          job: branch-gate
      - run:
          name: Install browser harness dependencies
          command: |
            source "$BASH_ENV"
            bun x playwright install webkit
            bun x playwright install-deps webkit
            bun x cypress install
            bun x cypress verify
      - run:
          name: Run canonical branch quality gate
          no_output_timeout: 30m
          command: |
            source "$BASH_ENV"
            bun run ci:gate:branch
      - store_artifacts:
          path: artifacts/ci
          destination: branch-gate

  third-party-review:
    executor: node_bun
    steps:
      - prepare_checkout
      - resolve_pr_metadata
      - require_ci_job:
          job: third-party-review
      - run:
          name: Install pinned review tools
          command: ci-cd/install-pinned-review-tools.sh "$HOME/review-tools"
      - run:
          name: Scan Git history for secrets
          command: |
            source "$BASH_ENV"
            set +e
            BASE_REF="${JUMENTIX_PR_BASE_REF:-${CIRCLE_BRANCH:-dev}}"
            "$HOME/review-tools/gitleaks" git . \
              --log-opts="origin/${BASE_REF}..HEAD" \
              --redact --report-format sarif --report-path gitleaks.sarif
            echo "$?" > gitleaks.exit
      - run:
          name: Run repository-owned Semgrep policy
          command: |
            source "$BASH_ENV"
            set +e
            BASE_REF="${JUMENTIX_PR_BASE_REF:-${CIRCLE_BRANCH:-dev}}"
            "$HOME/review-tools/semgrep" scan --config .semgrep.yml --baseline-commit "origin/${BASE_REF}" \
              --sarif --output semgrep.sarif
            echo "$?" > semgrep.exit
      - run:
          name: Enforce scanner outcomes
          command: |
            test "$(cat gitleaks.exit)" = "0"
            test "$(cat semgrep.exit)" = "0"
      - store_artifacts:
          path: gitleaks.sarif
      - store_artifacts:
          path: semgrep.sarif

  workspace-builds:
    executor: node_bun
    steps:
      - prepare_checkout
      - resolve_pr_metadata
      - require_ci_job:
          job: workspace-builds
      - run:
          name: Run workspace package builds
          no_output_timeout: 30m
          command: |
            source "$BASH_ENV"
            bun run mono:build

  workspace-tests:
    executor: node_bun
    steps:
      - prepare_checkout
      - resolve_pr_metadata
      - require_ci_job:
          job: workspace-tests
      - run:
          name: Run workspace package tests
          no_output_timeout: 30m
          command: |
            source "$BASH_ENV"
            bun run mono:test
      - store_artifacts:
          path: artifacts/ci
          destination: workspace-tests

  browser-matrix:
    executor: node_bun
    steps:
      - prepare_checkout
      - resolve_pr_metadata
      - require_ci_job:
          job: browser-matrix
      - run:
          name: Install Cypress binary
          command: |
            source "$BASH_ENV"
            bun x cypress install
            bun x cypress verify
      - run:
          name: Install Playwright WebKit
          command: |
            source "$BASH_ENV"
            bun x playwright install webkit
            bun x playwright install-deps webkit
      - run:
          name: Run Cana browser matrix
          no_output_timeout: 30m
          command: |
            source "$BASH_ENV"
            for engine in chrome firefox webkit; do
              bun packages/cana/scripts/run-browser-tests.js --browser "$engine"
            done

  integration:
    executor: node_bun_services
    steps:
      - prepare_checkout
      - resolve_pr_metadata
      - require_ci_job:
          job: integration
      - wait_for_services
      - run:
          name: Install WebKit for browser-based integration tests
          command: |
            source "$BASH_ENV"
            bun x playwright install webkit
            bun x playwright install-deps webkit
      - run:
          name: Run integration matrix
          no_output_timeout: 30m
          command: |
            source "$BASH_ENV"
            bun run ci:integration

  coverage:
    executor: node_bun_services
    environment:
      AAA_REDIS_HOST: 127.0.0.1
      AAA_REDIS_PORT: "6379"
      AAA_BULLMQ_REDIS_HOST: 127.0.0.1
      AAA_BULLMQ_REDIS_PORT: "6379"
      AAA_RABBITMQ_URL: amqp://127.0.0.1:5672
    steps:
      - prepare_checkout
      - resolve_pr_metadata
      - require_ci_job:
          job: coverage
      - wait_for_services
      - run:
          name: Produce Jest coverage
          command: |
            source "$BASH_ENV"
            bun run test:coverage
            mkdir -p coverage/jest
            cp coverage/coverage-final.json coverage/jest/coverage-final.json
      - run:
          name: Produce browser coverage for every supported engine
          no_output_timeout: 30m
          command: |
            source "$BASH_ENV"
            bun x cypress install
            bun x cypress verify
            for engine in chrome firefox webkit; do
              if [ "$engine" = webkit ]; then
                bun x playwright install webkit
                bun x playwright install-deps webkit
              fi
              bun packages/cana/scripts/run-browser-tests.js --browser "$engine"
              bun packages/cana/scripts/write-browser-lcov.js
              mkdir -p "coverage/browser-$engine"
              cp coverage/browser/coverage-final.json "coverage/browser-$engine/coverage-final.json"
              cp coverage/browser/lcov.info "coverage/browser-$engine/lcov.info"
            done
      - run:
          name: Union browser coverage engines
          command: |
            source "$BASH_ENV"
            bun packages/cana/scripts/merge-browser-coverage.js --from-dir coverage
      - run:
          name: Enforce full coverage thresholds
          command: |
            source "$BASH_ENV"
            bun run coverage:check
      - run:
          name: Produce frontend coverage for the patch report
          command: |
            source "$BASH_ENV"
            bun run frontend:test:coverage
      - run:
          name: Enforce patch coverage
          command: |
            source "$BASH_ENV"
            if [ -n "${CIRCLE_PULL_REQUEST:-}" ]; then
              bun run coverage:merge
              bun run coverage:patch
            else
              echo "Patch coverage is PR-only; project coverage already passed."
            fi
      - run:
          name: Install verified Codecov CLI
          command: |
            curl -Os https://cli.codecov.io/latest/linux/codecov
            curl -Os https://cli.codecov.io/latest/linux/codecov.SHA256SUM
            shasum -a 256 -c codecov.SHA256SUM
            chmod +x codecov
      - run:
          name: Upload coverage to Codecov
          command: |
            test -n "${CODECOV_TOKEN:-}"
            ./codecov --verbose upload-process --disable-search --fail-on-error \
              -t "$CODECOV_TOKEN" \
              --slug web2solutions/Jumentix \
              -n "jumentix-circleci-${CIRCLE_WORKFLOW_ID}" \
              -F project \
              -f coverage/lcov.info \
              -f coverage/browser/lcov.info
      - run:
          name: Verify Codecov public coverage reports
          command: CODECOV_BRANCH="${CIRCLE_BRANCH:-}" bun ci-cd/verify-codecov-public-reports.js
      - run:
          name: Install Sonar scanner
          command: |
            sonar_version="7.1.0.4889"
            sonar_dir="/tmp/sonar-scanner-${sonar_version}-linux-x64"
            rm -rf "$sonar_dir" /tmp/sonar-scanner.zip
            curl -fsSL -o /tmp/sonar-scanner.zip \
              "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${sonar_version}-linux-x64.zip"
            unzip -qo /tmp/sonar-scanner.zip -d /tmp
            echo "export PATH=${sonar_dir}/bin:\$PATH" >> "$BASH_ENV"
      - run:
          name: SonarQube Cloud Scan
          command: |
            source "$BASH_ENV"
            test -n "${SONAR_TOKEN:-}"
            sonar-scanner -Dsonar.scm.disabled=true
      - run:
          name: Report Sonar findings
          command: |
            source "$BASH_ENV"
            bun ci-cd/report-sonar-findings.js
      - run:
          name: Enforce SonarCloud reliability A
          command: SONAR_BRANCH="${CIRCLE_BRANCH:-}" bun run sonar:check-reliability
      - store_artifacts:
          path: coverage
          destination: coverage
      - store_artifacts:
          path: artifacts/ci
          destination: coverage-evidence

  website:
    executor: node_bun
    environment:
      JUMENTIX_WEBSITE_CYPRESS_SKIP_BUILD: "1"
      JUMENTIX_WEBSITE_CYPRESS_BROWSER: chrome
    steps:
      - prepare_checkout
      - resolve_pr_metadata
      - require_ci_job:
          job: website
      - run:
          name: Build Storybook
          command: |
            source "$BASH_ENV"
            bun run website:storybook:build
      - run:
          name: Validate Storybook inventory
          command: |
            source "$BASH_ENV"
            bun run website:storybook:smoke
      - run:
          name: Validate publishable website content
          command: |
            source "$BASH_ENV"
            bun run website:test:prepublish
      - run:
          name: Jest component, accessibility, and link quality gates
          command: |
            source "$BASH_ENV"
            bun run website:test:unit
      - run:
          name: Install Cypress binary
          command: |
            source "$BASH_ENV"
            bun x cypress install
      - run:
          name: Cypress website quality gates
          command: |
            source "$BASH_ENV"
            bun run website:test:cypress

  database-matrix:
    # JUM-875: the smoke matrix drives `docker compose` stacks and dials
    # 127.0.0.1; that only works with a local Docker daemon, so this job runs
    # on a machine VM instead of the Docker executor + remote docker.
    machine:
      image: ubuntu-2404:current
    environment:
      BUN_VERSION: 1.3.13
      JUMENTIX_CI_GATE_RESULT_FILE: artifacts/ci/branch-quality-gate.json
      JUMENTIX_CI_MATRIX_RESULT_FILE: artifacts/ci/full-test-matrix.json
      JUMENTIX_FULL_MATRIX_SKIP_CELLS: workspace-builds,workspace-tests,website-prepublish,integration
      AAA_JWT_TOKEN_SECRET_KEY: ci_jwt_secret_key
    steps:
      - run:
          name: Ensure Node.js 22 on the machine image
          command: |
            if ! node --version 2>/dev/null | grep -q '^v22\.'; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            node --version
      - prepare_checkout
      - resolve_pr_metadata
      - require_ci_job:
          job: database-matrix
      - run:
          name: Ensure Docker runtime
          command: ci-cd/ensure-docker-runtime.sh
      - run:
          name: Database driver smoke matrix against real containers
          no_output_timeout: 45m
          command: |
            source "$BASH_ENV"
            bun run test:smoke:db:all
      - run:
          name: Redis key-value integration against a real server
          no_output_timeout: 15m
          command: |
            source "$BASH_ENV"
            bun run smoke:key-value:redis
      - run:
          name: Dead-letter queue integration against a real Redis
          no_output_timeout: 15m
          command: |
            source "$BASH_ENV"
            bun run smoke:dead-letter:redis
      - run:
          name: Broker integration against real RabbitMQ and Redis
          no_output_timeout: 15m
          command: |
            source "$BASH_ENV"
            bun run smoke:message-mediator
      - run:
          name: External repository adapters against Cassandra and MongoDB
          no_output_timeout: 20m
          command: |
            source "$BASH_ENV"
            bun run smoke:db-repositories

workflows:
  ci:
    jobs:
      - branch-gate
      - third-party-review
      - browser-matrix
      - workspace-builds
      - workspace-tests
      - integration
      - coverage
      - website
      - database-matrix
  # JUM-874: a workflow with a schedule trigger runs ONLY on the schedule, so
  # the nightly full matrix lives in its own workflow and `ci` keeps running on
  # every push/PR. The context classifier maps this to scheduled-full.
  nightly:
    triggers:
      - schedule:
          cron: "17 3 * * *"
          filters:
            branches:
              only:
                - main
                - dev
    jobs:
      - branch-gate
      - third-party-review
      - browser-matrix
      - workspace-builds
      - workspace-tests
      - integration
      - coverage
      - website
      - database-matrix
