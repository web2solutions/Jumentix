version: 2.1

# x-jumentix-temporary-bridge: github-actions-billing-2026-08
#
# Temporary bridge, per Requirement 113's bridge amendment (owner decision,
# 2026-08-03). The GitHub Actions included allowance for this private
# repository is exhausted — new job starts are rejected with "recent account
# payments have failed or your spending limit needs to be increased" — and
# Requirement 113 §3 makes GitHub Actions canonical only *while that allowance
# is available*. It is not, so CircleCI runs the repository-owned gates until
# it is restored. This file must be deleted, together with the bridge section
# in Requirement 113, when the allowance returns.
#
# The repository-owned workflows under .github/workflows/ remain authoritative
# for WHAT the gate is; this file mirrors them job for job and changes no
# threshold, check, or review requirement. The previous permanent CircleCI
# pipeline was retired in ac9c4a9 and its structure is reused where the gate
# has not changed since.

commands:
  bootstrap:
    description: Assert the pinned toolchain, then install from the frozen lockfile.
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-v3-{{ .Branch }}-{{ checksum "bun.lock" }}
            - bun-deps-v3-{{ .Branch }}-
            - bun-deps-v3-
      - run:
          name: Assert the pinned Bun toolchain
          command: bun ci-cd/check-bun-version.js
      - run:
          name: Install dependencies
          # Frozen. The pre-Bun pipeline used --no-frozen-lockfile, which let CI
          # resolve versions the lockfile never recorded (Requirement 096 §2).
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-deps-v3-{{ .Branch }}-{{ checksum "bun.lock" }}
          paths:
            - node_modules
            - ~/.bun/install/cache

  install_bun:
    description: >
      Install the pinned Bun toolchain into a non-Bun image (the browsers
      image ships Node, not Bun). Exact version, from the same .bun-version
      the toolchain guard then asserts.
    steps:
      - run:
          name: Install Bun 1.3.14
          command: npm install --global bun@1.3.14

  require_env:
    description: >
      Fail closed when a required variable is absent. A step that skips itself
      and reports success is the false green Requirement 065 forbids.
    parameters:
      names:
        type: string
    steps:
      - run:
          name: Verify required environment
          command: |
            missing=""
            for name in << parameters.names >>; do
              eval "value=\${$name:-}"
              if [ -z "$value" ]; then missing="$missing $name"; fi
            done
            if [ -n "$missing" ]; then
              echo "Missing required CircleCI environment variable(s):$missing" >&2
              echo "Set them in Project Settings > Environment Variables." >&2
              exit 1
            fi

  wait_for_services:
    description: >
      Fail closed unless Redis and RabbitMQ accept connections. Bun rather
      than dockerize: downloading a tarball from a GitHub release on every run
      lets an unrelated third-party outage fail this pipeline.
    steps:
      - run:
          name: Wait for Redis and RabbitMQ
          command: |
            for attempt in $(seq 1 90); do
              if bun -e "
                const probe = async (port) => {
                  const socket = await Bun.connect({
                    hostname: '127.0.0.1', port,
                    socket: { data() {}, error() {} }
                  }).catch(() => null);
                  if (!socket) return false;
                  socket.end();
                  return true;
                };
                if (!(await probe(6379)) || !(await probe(5672))) process.exit(1);
              " 2>/dev/null; then
                echo 'Redis and RabbitMQ are accepting connections.'
                exit 0
              fi
              sleep 1
            done
            echo 'Services did not accept connections within 90s.' >&2
            exit 1

jobs:
  # Mirrors .github/workflows/test.yml (the `build` check).
  quality-gate:
    docker:
      # Official Bun image at the pinned version (Requirement 096 §1).
      - image: oven/bun:1.3.14
      - image: redis:7.2-alpine
        # No `--requirepass`, and no password anywhere in this file. The
        # container lives for one job and is reachable only from it, so the
        # password protected nothing — while being a real credential-shaped
        # string in a tracked file. `.env.dev` sets `AAA_REDIS_PASSWORD=`
        # empty, and `RedisKeyValueStorageClient` passes `undefined` when it
        # is unset: this matches how the suites actually connect.
      - image: rabbitmq:3.13-alpine
    environment:
      # A fixture with no security role: the JWT signing key for a throwaway
      # in-memory user store, overridable from the project environment.
      AAA_JWT_TOKEN_SECRET_KEY: ci_jwt_secret_key
    steps:
      - bootstrap
      - wait_for_services
      - run:
          name: Run the branch-aware quality gate
          # Firestore service account for agent registry (Req 089 replacement).
          command: |
            export FIREBASE_SERVICE_ACCOUNT_KEY="${FIREBASE_SERVICE_ACCOUNT_KEY:-}"
            mkdir -p artifacts/ci
            JUMENTIX_QUALITY_GATE_TARGET="${CIRCLE_BRANCH:-dev}" \
            JUMENTIX_TASK_TEST_MODE=range \
            JUMENTIX_TASK_TEST_BASE=origin/dev \
            AAA_PR_HEAD_REF="${CIRCLE_BRANCH:-}" \
            AAA_CI_GATE_RESULT_FILE=artifacts/ci/branch-quality-gate.json \
            AAA_CI_MATRIX_RESULT_FILE=artifacts/ci/full-test-matrix.json \
              bun run ci:gate:branch
      - store_artifacts:
          path: artifacts/ci/branch-quality-gate.json
          destination: branch-quality-gate.json
      - store_artifacts:
          path: artifacts/ci/full-test-matrix.json
          destination: full-test-matrix.json

  # Mirrors .github/workflows/coverage.yml, including the engine-union gate.
  # CircleCI bills per job, not per parallel container, so the matrix runs
  # sequentially in one job: Jest against real services, then the Cana browser
  # suite on all three engines, unioned before any threshold is read.
  coverage:
    docker:
      # The browsers image carries Chrome and Firefox; WebKit arrives with the
      # playwright-webkit dev dependency and its system packages below.
      - image: cimg/node:22.21.0-browsers
      - image: redis:7.2-alpine
      - image: rabbitmq:3.13-alpine
    environment:
      AAA_JWT_TOKEN_SECRET_KEY: ci_jwt_secret_key
      RUN_REDIS_INTEGRATION: "1"
      RUN_BROKER_INTEGRATION: "1"
      AAA_REDIS_HOST: 127.0.0.1
      AAA_REDIS_PORT: "6379"
      AAA_BULLMQ_REDIS_HOST: 127.0.0.1
      AAA_BULLMQ_REDIS_PORT: "6379"
      AAA_RABBITMQ_URL: amqp://127.0.0.1:5672
    steps:
      - checkout
      - install_bun
      - bootstrap
      - wait_for_services
      - run:
          name: Produce Jest coverage (unit + real Redis/broker integration)
          command: bun run test:coverage
      - run:
          name: Produce browser coverage (chrome), preserve it
          command: |
            bun ci-cd/run-browser-tests.js --browser chrome
            bun ci-cd/write-browser-lcov.js
            cp -r coverage/browser coverage/browser-chrome
      - run:
          name: Install WebKit system dependencies
          command: sudo env "PATH=$PATH" bunx playwright install-deps webkit
      - run:
          name: Produce browser coverage (firefox, webkit), preserve each
          command: |
            bun ci-cd/run-browser-tests.js --browser firefox
            bun ci-cd/write-browser-lcov.js
            cp -r coverage/browser coverage/browser-firefox
            bun ci-cd/run-browser-tests.js --browser webkit
            bun ci-cd/write-browser-lcov.js
            cp -r coverage/browser coverage/browser-webkit
      - run:
          name: Union every engine's browser report
          command: bun ci-cd/merge-browser-coverage.js --from-dir coverage
      - run:
          # The authority on all four metrics, branches included
          # (Requirement 110), grading the same union Sonar does.
          name: Enforce all coverage metrics at 99/90/99/99
          command: bun run coverage:check
      - run:
          name: Enforce patch coverage
          command: |
            bun run coverage:merge
            bun run coverage:patch
      - store_artifacts:
          path: coverage
          destination: coverage
      - store_artifacts:
          path: artifacts/ci/browser-matrix.json
          destination: browser-matrix.json

  # Mirrors .github/workflows/website.yml.
  # Browsers image required: Cypress drives Chrome for the JUM-396 route gates.
  website:
    docker:
      - image: cimg/node:22.21.0-browsers
    steps:
      - checkout
      - install_bun
      - bootstrap
      - run:
          name: Build Storybook
          command: bun run website:storybook:build
      - run:
          name: Validate Storybook inventory
          command: bun run website:storybook:smoke
      - run:
          name: Validate publishable website content
          command: bun run website:test:prepublish
      - run:
          name: Install Cypress binary
          command: bunx cypress install
      - run:
          name: Cypress website quality gates (JUM-396)
          command: bun run website:test:cypress
          environment:
            JUMENTIX_WEBSITE_CYPRESS_SKIP_BUILD: "1"
            JUMENTIX_WEBSITE_CYPRESS_BROWSER: chrome

  # Mirrors .github/workflows/sonarqube-cloud.yml: same Jest + browser union,
  # then the scanner. Sonar stays defense-in-depth (Requirement 113 §7).
  sonarqube:
    docker:
      - image: cimg/node:22.21.0-browsers
      - image: redis:7.2-alpine
      - image: rabbitmq:3.13-alpine
    environment:
      AAA_JWT_TOKEN_SECRET_KEY: ci_jwt_secret_key
      RUN_REDIS_INTEGRATION: "1"
      RUN_BROKER_INTEGRATION: "1"
      AAA_REDIS_HOST: 127.0.0.1
      AAA_REDIS_PORT: "6379"
      AAA_BULLMQ_REDIS_HOST: 127.0.0.1
      AAA_BULLMQ_REDIS_PORT: "6379"
      AAA_RABBITMQ_URL: amqp://127.0.0.1:5672
    steps:
      - checkout
      - install_bun
      - bootstrap
      - wait_for_services
      - require_env:
          names: SONAR_TOKEN
      - run:
          name: Produce Jest coverage (unit + real Redis/broker integration)
          command: bun run test:coverage
      - run:
          name: Produce browser coverage (chrome), preserve it
          command: |
            bun ci-cd/run-browser-tests.js --browser chrome
            bun ci-cd/write-browser-lcov.js
            cp -r coverage/browser coverage/browser-chrome
      - run:
          name: Install WebKit system dependencies
          command: sudo env "PATH=$PATH" bunx playwright install-deps webkit
      - run:
          name: Produce browser coverage (firefox, webkit), preserve each
          command: |
            bun ci-cd/run-browser-tests.js --browser firefox
            bun ci-cd/write-browser-lcov.js
            cp -r coverage/browser coverage/browser-firefox
            bun ci-cd/run-browser-tests.js --browser webkit
            bun ci-cd/write-browser-lcov.js
            cp -r coverage/browser coverage/browser-webkit
      - run:
          name: Union every engine's browser report
          command: bun ci-cd/merge-browser-coverage.js --from-dir coverage
      - run:
          name: Enforce coverage thresholds
          command: bun run coverage:check
      - run:
          name: SonarQube Cloud scan
          # The scanner is a Java CLI. Fetched here rather than through an orb
          # so the version is visible in this file instead of behind an orb tag.
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends unzip curl default-jre-headless
            SCANNER_VERSION=6.2.1.4610
            curl -sSLo /tmp/scanner.zip \
              "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip"
            sudo unzip -q /tmp/scanner.zip -d /opt
            export PATH="/opt/sonar-scanner-${SCANNER_VERSION}-linux-x64/bin:$PATH"
            sonar-scanner -Dsonar.token="${SONAR_TOKEN}"
      - run:
          # A failed quality gate otherwise reports two letters and a link
          # that needs a SonarCloud session. Advisory: the gate blocks, this
          # explains.
          name: Report Sonar findings
          when: always
          command: bun ci-cd/report-sonar-findings.js

workflows:
  continuous-integration:
    jobs:
      # No branch filter: a branch with no signal is where defects get
      # expensive (the retired configuration ran only on dev and main).
      - quality-gate
      - coverage
      - website
      - sonarqube:
          # Analysis is only actionable against the long-lived branches and
          # the scan is billed per run, so this one stays filtered.
          filters:
            branches:
              only:
                - dev
                - main
