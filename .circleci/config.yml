version: 2.1

commands:
  prepare_ci_context:
    steps:
      - checkout
      - run:
          name: Fetch branch references
          command: git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"
      - run:
          name: Load pull request metadata for context classification
          command: |
            set -euo pipefail
            if [ -z "${CIRCLE_PULL_REQUEST:-}" ] || [ -n "${CIRCLE_PR_BASE_BRANCH:-}" ]; then
              exit 0
            fi
            export GH_TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-${AGENT_REGISTRY_TOKEN:-}}}"
            if [ -z "${GH_TOKEN:-}" ]; then
              echo "GH_TOKEN, GITHUB_TOKEN, or AGENT_REGISTRY_TOKEN is required to classify private PR context."
              exit 1
            fi
            PR_NUMBER="${CIRCLE_PULL_REQUEST##*/}"
            PR_API_URL="https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME:-XpertMinds}/${CIRCLE_PROJECT_REPONAME:-Jumentix}/pulls/${PR_NUMBER}"
            PR_JSON_FILE="$(mktemp)"
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "$PR_JSON_FILE" \
              "$PR_API_URL"
            PR_JSON_FILE="$PR_JSON_FILE" node -e '
            const fs = require("fs");
            const pullRequest = JSON.parse(fs.readFileSync(process.env.PR_JSON_FILE, "utf8"));
            const shellQuote = (value) => `"${String(value ?? "").replace(/(["\\$`])/g, "\\$1")}"`;
            const values = {
              JUMENTIX_PR_HEAD_REF: pullRequest.head?.ref || process.env.CIRCLE_BRANCH,
              JUMENTIX_PR_BASE_REF: pullRequest.base?.ref || "",
              AAA_PR_HEAD_REF: pullRequest.head?.ref || process.env.CIRCLE_BRANCH,
              AAA_PR_BASE_REF: pullRequest.base?.ref || ""
            };
            for (const [key, value] of Object.entries(values)) {
              console.log(`export ${key}=${shellQuote(value)}`);
            }
            ' >> "$BASH_ENV"
            source "$BASH_ENV"

  halt_unselected_job:
    parameters:
      job:
        type: string
    steps:
      - run:
          name: Classify CI context for << parameters.job >>
          command: |
            set +e
            mkdir -p artifacts/ci
            node ci-cd/classify-ci-context.js \
              --result-file artifacts/ci/ci-context.json \
              --require-job "<< parameters.job >>"
            status="$?"
            set -e
            if [ "$status" = "78" ]; then
              circleci-agent step halt
            fi
            exit "$status"

  install_bun:
    steps:
      - run:
          name: Install Bun 1.3.14
          command: |
            set -euo pipefail
            if ! command -v curl >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends curl ca-certificates
            fi
            curl -fsSL https://bun.sh/install | BUN_VERSION=1.3.14 bash
            {
              echo 'export BUN_INSTALL="$HOME/.bun"'
              echo 'export PATH="$BUN_INSTALL/bin:$PATH"'
            } >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version

  bootstrap_dependencies:
    steps:
      - restore_cache:
          keys:
            - bun-deps-v5-{{ .Branch }}-{{ checksum "bun.lock" }}
            - bun-deps-v5-{{ .Branch }}-
            - bun-deps-v5-
      - install_bun
      - run:
          name: Assert the pinned Bun toolchain
          command: bun ci-cd/check-bun-version.js
      - run:
          name: Install frozen dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Assert the Node.js 22 compatibility contract
          command: bun run compat:check-node-version
      - save_cache:
          key: bun-deps-v5-{{ .Branch }}-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache
            - ~/.cache/Cypress
            - ~/.cache/ms-playwright
            - node_modules

  bootstrap:
    steps:
      - prepare_ci_context
      - bootstrap_dependencies

  wait_tcp:
    parameters:
      port:
        type: integer
    steps:
      - run:
          name: Wait for TCP port << parameters.port >>
          command: |
            node -e '
            const net = require("node:net");
            const port = Number(process.env.WAIT_PORT);
            const deadline = Date.now() + 90_000;
            function attempt() {
              const socket = net.connect({ host: "127.0.0.1", port }, () => {
                socket.end();
                process.exit(0);
              });
              socket.on("error", () => {
                if (Date.now() > deadline) process.exit(1);
                setTimeout(attempt, 1_000);
              });
            }
            attempt();
            '
          environment:
            WAIT_PORT: << parameters.port >>

jobs:
  branch-gate:
    docker:
      - image: cypress/browsers:node-22.21.0-chrome-141.0.7390.107-1-ff-144.0-edge-141.0.3537.92-1
      - image: redis:7.2-alpine
      - image: rabbitmq:3.13-alpine
    resource_class: large
    steps:
      - bootstrap
      - wait_tcp:
          port: 6379
      - wait_tcp:
          port: 5672
      - run:
          # The service-management smoke boots the SPA in real WebKit (JUM-466);
          # the JUM-472 layer mapping selects SM integration suites here.
          name: Install WebKit for browser-based integration tests
          command: |
            bun x playwright install webkit
            bun x playwright install-deps webkit
      - run:
          # JUM-622 puts cana's eighteen Cypress specs in the manifest, so the
          # task gate can now select `test:browser` here. The image carries
          # Chrome, Firefox and Edge but not the Cypress binary — without this
          # step the suite the selector just made reachable would fail to start.
          name: Install the Cypress binary for the browser-harness layer
          command: |
            bun x cypress install
            bun x cypress verify
      - run:
          name: Run canonical branch quality gate
          no_output_timeout: 30m
          command: |
            export FIREBASE_SERVICE_ACCOUNT_KEY="${FIREBASE_SERVICE_ACCOUNT_KEY:-}"
            export GH_TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-${AGENT_REGISTRY_TOKEN:-}}}"
            # JUM-627: pr:governance:check resolves the child task issue in
            # Linear to confirm it is in the epic the body names. Without this
            # the check cannot verify membership, and it fails rather than
            # passing on a lookup it never made.
            export LINEAR_API_KEY="${LINEAR_API_KEY:-}"
            if [ -n "${CIRCLE_PULL_REQUEST:-}" ]; then
              export JUMENTIX_QUALITY_GATE_TARGET="${CIRCLE_PR_BASE_BRANCH:-${JUMENTIX_PR_BASE_REF:-dev}}"
              export AAA_CI_IS_PULL_REQUEST=1
              if [ -z "${GH_TOKEN:-}" ]; then
                echo "GH_TOKEN, GITHUB_TOKEN, or AGENT_REGISTRY_TOKEN is required to load private PR metadata for branch-gate."
                exit 1
              fi
              PR_NUMBER="${CIRCLE_PULL_REQUEST##*/}"
              PR_API_URL="https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME:-XpertMinds}/${CIRCLE_PROJECT_REPONAME:-Jumentix}/pulls/${PR_NUMBER}"
              PR_JSON_FILE="$(mktemp)"
              curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -o "$PR_JSON_FILE" \
                "$PR_API_URL"
              PR_JSON_FILE="$PR_JSON_FILE" node -e '
            const fs = require("fs");
            const pullRequest = JSON.parse(fs.readFileSync(process.env.PR_JSON_FILE, "utf8"));
            const shellQuote = (value) => `"${String(value ?? "").replace(/(["\\$`])/g, "\\$1")}"`;
            const headRef = pullRequest.head?.ref || process.env.CIRCLE_BRANCH;
            const baseRef = pullRequest.base?.ref || process.env.CIRCLE_PR_BASE_BRANCH || "dev";
            const values = {
              JUMENTIX_PR_TITLE: pullRequest.title,
              JUMENTIX_PR_BODY: pullRequest.body,
              JUMENTIX_PR_HEAD_REF: headRef,
              JUMENTIX_PR_BASE_REF: baseRef,
              AAA_PR_TITLE: pullRequest.title,
              AAA_PR_BODY: pullRequest.body,
              AAA_PR_HEAD_REF: headRef,
              AAA_PR_BASE_REF: baseRef
            };
            for (const [key, value] of Object.entries(values)) {
              console.log(`export ${key}=${shellQuote(value)}`);
            }
            ' > /tmp/jumentix-pr-env.sh
              . /tmp/jumentix-pr-env.sh
            else
              export JUMENTIX_QUALITY_GATE_TARGET="${CIRCLE_BRANCH:-dev}"
              export AAA_CI_IS_PULL_REQUEST=0
            fi
            export JUMENTIX_PR_HEAD_REF="${JUMENTIX_PR_HEAD_REF:-${CIRCLE_BRANCH:-}}"
            export JUMENTIX_PR_BASE_REF="${JUMENTIX_PR_BASE_REF:-${CIRCLE_PR_BASE_BRANCH:-}}"
            export AAA_PR_HEAD_REF="${AAA_PR_HEAD_REF:-${JUMENTIX_PR_HEAD_REF:-}}"
            export AAA_PR_BASE_REF="${AAA_PR_BASE_REF:-${JUMENTIX_PR_BASE_REF:-}}"
            bun run ci:gate:branch
          environment:
            AAA_JWT_TOKEN_SECRET_KEY: ci_jwt_secret_key
            JUMENTIX_TASK_TEST_MODE: range
            JUMENTIX_TASK_TEST_BASE: origin/dev
            JUMENTIX_CI_GATE_RESULT_FILE: artifacts/ci/branch-quality-gate.json
            JUMENTIX_CI_MATRIX_RESULT_FILE: artifacts/ci/full-test-matrix.json
            JUMENTIX_FULL_MATRIX_SKIP_CELLS: workspace-builds,workspace-tests,website-prepublish,integration
      - store_artifacts:
          path: artifacts/ci
          destination: branch-gate

  workspace-builds:
    docker:
      - image: cimg/node:22.23-browsers
    resource_class: large
    steps:
      - prepare_ci_context
      - halt_unselected_job:
          job: workspace-builds
      - bootstrap_dependencies
      - run:
          name: Run workspace package builds
          no_output_timeout: 30m
          command: bun run mono:build

  workspace-tests:
    docker:
      - image: cypress/browsers:node-22.21.0-chrome-141.0.7390.107-1-ff-144.0-edge-141.0.3537.92-1
    resource_class: large
    steps:
      - prepare_ci_context
      - halt_unselected_job:
          job: workspace-tests
      - bootstrap_dependencies
      - run:
          name: Run workspace package tests
          no_output_timeout: 30m
          command: bun run mono:test
      - store_artifacts:
          path: artifacts/ci
          destination: workspace-tests

  integration:
    docker:
      - image: cypress/browsers:node-22.21.0-chrome-141.0.7390.107-1-ff-144.0-edge-141.0.3537.92-1
      - image: redis:7.2-alpine
      - image: rabbitmq:3.13-alpine
    resource_class: large
    steps:
      - prepare_ci_context
      - halt_unselected_job:
          job: integration
      - bootstrap_dependencies
      - wait_tcp:
          port: 6379
      - wait_tcp:
          port: 5672
      - run:
          # The service-management smoke boots the SPA in real WebKit (JUM-466).
          name: Install WebKit for browser-based integration tests
          command: |
            bun x playwright install webkit
            bun x playwright install-deps webkit
      - run:
          name: Run integration matrix
          no_output_timeout: 30m
          command: bun run ci:integration
          environment:
            AAA_JWT_TOKEN_SECRET_KEY: ci_jwt_secret_key

  coverage:
    docker:
      - image: cypress/browsers:node-22.21.0-chrome-141.0.7390.107-1-ff-144.0-edge-141.0.3537.92-1
      - image: redis:7.2-alpine
      - image: rabbitmq:3.13-alpine
    resource_class: large
    steps:
      - prepare_ci_context
      - halt_unselected_job:
          job: coverage
      - bootstrap_dependencies
      - wait_tcp:
          port: 6379
      - wait_tcp:
          port: 5672
      - run:
          name: Produce Jest coverage
          command: |
            bun run test:coverage
            mkdir -p coverage/jest
            cp coverage/coverage-final.json coverage/jest/coverage-final.json
          environment:
            AAA_JWT_TOKEN_SECRET_KEY: ci_jwt_secret_key
            RUN_REDIS_INTEGRATION: "1"
            RUN_BROKER_INTEGRATION: "1"
            AAA_REDIS_HOST: 127.0.0.1
            AAA_REDIS_PORT: "6379"
            AAA_BULLMQ_REDIS_HOST: 127.0.0.1
            AAA_BULLMQ_REDIS_PORT: "6379"
            AAA_RABBITMQ_URL: amqp://127.0.0.1:5672
      - run:
          name: Produce browser coverage for every supported engine
          command: |
            set -euo pipefail
            bun x cypress install
            bun x cypress verify
            for engine in chrome firefox webkit; do
              if [ "$engine" = webkit ]; then
                bun x playwright install webkit
                bun x playwright install-deps webkit
              fi
              bun ci-cd/run-browser-tests.js --browser "$engine"
              bun ci-cd/write-browser-lcov.js
              mkdir -p "coverage/browser-$engine"
              cp coverage/browser/coverage-final.json "coverage/browser-$engine/coverage-final.json"
              cp coverage/browser/lcov.info "coverage/browser-$engine/lcov.info"
            done
      - run:
          name: Union browser engines and enforce thresholds
          command: |
            bun ci-cd/merge-browser-coverage.js --from-dir coverage
            bun run coverage:check
      - run:
          name: Enforce patch coverage
          command: |
            if [ -n "${CIRCLE_PULL_REQUEST:-}" ]; then
              bun run coverage:merge
              bun run coverage:patch
            else
              echo "Patch coverage is PR-only; project coverage already passed."
            fi
      - run:
          name: Install verified Codecov CLI
          command: |
            set -euo pipefail
            curl -Os https://cli.codecov.io/latest/linux/codecov
            curl -Os https://cli.codecov.io/latest/linux/codecov.SHA256SUM
            shasum -a 256 -c codecov.SHA256SUM
            chmod +x codecov
      - run:
          name: Upload coverage to Codecov
          command: |
            test -n "${CODECOV_TOKEN:-}"
            ./codecov --verbose upload-process --disable-search --fail-on-error \
              -t "$CODECOV_TOKEN" \
              -n "jumentix-${CIRCLE_WORKFLOW_ID}" \
              -F project \
              -f coverage/lcov.info \
              -f coverage/browser/lcov.info
      - run:
          name: Install Sonar scanner
          command: |
            set -euo pipefail
            curl -fsSL -o /tmp/sonar-scanner.zip \
              https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.1.0.4889-linux-x64.zip
            unzip -q /tmp/sonar-scanner.zip -d /tmp
            echo 'export PATH="/tmp/sonar-scanner-7.1.0.4889-linux-x64/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: SonarQube Cloud Scan
          command: |
            SONAR_TARGET_BRANCH="${CIRCLE_PR_BASE_BRANCH:-${CIRCLE_BRANCH:-}}"
            if [ "$SONAR_TARGET_BRANCH" != "main" ] && [ "$SONAR_TARGET_BRANCH" != "dev" ]; then
              echo "Skipping Sonar for ${SONAR_TARGET_BRANCH:-unknown}; Sonar runs for PRs or pushes targeting dev/main."
              exit 0
            fi
            test -n "${SONAR_TOKEN:-}"
            source "$BASH_ENV"
            sonar-scanner -Dsonar.scm.disabled=true
      - run:
          name: Report Sonar findings
          command: bun ci-cd/report-sonar-findings.js
      - persist_to_workspace:
          root: .
          paths:
            - coverage
      - store_artifacts:
          path: coverage
          destination: coverage

  website:
    docker:
      - image: cimg/node:22.23-browsers
    resource_class: large
    steps:
      - prepare_ci_context
      - halt_unselected_job:
          job: website
      - bootstrap_dependencies
      - run:
          name: Build Storybook
          command: bun run website:storybook:build
      - run:
          name: Validate Storybook inventory
          command: bun run website:storybook:smoke
      - run:
          name: Validate publishable website content
          command: bun run website:test:prepublish
      - run:
          name: Install Cypress binary
          command: bun x cypress install
      - run:
          name: Cypress website quality gates (JUM-396)
          command: bun run website:test:cypress
          environment:
            JUMENTIX_WEBSITE_CYPRESS_SKIP_BUILD: "1"
            # cimg browsers often expose Electron to Cypress more reliably than
            # the "chrome" binary name; GHA keeps chrome.
            JUMENTIX_WEBSITE_CYPRESS_BROWSER: electron

  third-party-review:
    docker:
      - image: cimg/node:22.23-browsers
    resource_class: large
    steps:
      - prepare_ci_context
      - halt_unselected_job:
          job: third-party-review
      - run:
          name: Install pinned review tools
          command: |
            python_version="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
            sudo apt-get update
            sudo apt-get install -y "python${python_version}-venv"
            ci-cd/install-pinned-review-tools.sh "$HOME/review-tools"
      - run:
          name: Scan Git history for secrets
          command: |
            set +e
            BASE_REF="${CIRCLE_PR_BASE_BRANCH:-dev}"
            "$HOME/review-tools/gitleaks" git . \
              --log-opts="origin/${BASE_REF}..HEAD" \
              --redact --report-format sarif --report-path gitleaks.sarif
            echo "$?" > gitleaks.exit
      - run:
          name: Run repository-owned Semgrep policy
          command: |
            set +e
            BASE_REF="${CIRCLE_PR_BASE_BRANCH:-dev}"
            "$HOME/review-tools/semgrep" scan --config .semgrep.yml --baseline-commit "origin/${BASE_REF}" \
              --sarif --output semgrep.sarif
            echo "$?" > semgrep.exit
      - store_artifacts:
          path: gitleaks.sarif
          destination: third-party-review/gitleaks.sarif
      - store_artifacts:
          path: semgrep.sarif
          destination: third-party-review/semgrep.sarif
      - run:
          name: Enforce scanner outcomes
          command: |
            test "$(cat gitleaks.exit)" = "0"
            test "$(cat semgrep.exit)" = "0"

  # The docker-backed smoke suites (JUM-600).
  #
  # A `machine` executor rather than `docker` + `setup_remote_docker`: the
  # repository's own `docker:up:*` scripts run `docker compose`, and the smoke
  # tests connect to `127.0.0.1`. With a remote daemon the containers live on a
  # different host and those ports are not reachable, so the suites would skip
  # themselves and report success — the exact false green this job exists to
  # prevent.
  #
  # Naming the step here is safe again: `check-third-party-review.js` reads the
  # parsed `third-party-review` job rather than grepping this file as text
  # (JUM-616), so a comment cannot fail the check that forbids the step.
  #
  # Runs on `dev` and `main` only, not on every pull request. Ten database
  # containers take minutes and pull images; per-PR is too expensive, and
  # release-only would let a regression sit in `dev` until a release trips over
  # it. Post-merge on `dev` catches it the same day.
  database-matrix:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - prepare_ci_context
      - halt_unselected_job:
          job: database-matrix
      - install_bun
      - run:
          name: Install frozen dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Database driver smoke matrix against real containers
          no_output_timeout: 45m
          # Each `smoke:db:*` script brings its own compose file up, runs the
          # driver, and takes it down again. Sequential by design: ten database
          # servers at once exhausts the box, and a container that fails to
          # start is then indistinguishable from a driver that cannot connect.
          command: bun run test:smoke:db:all
      - run:
          name: Redis key-value integration against a real server
          no_output_timeout: 15m
          command: bun run smoke:key-value:redis
      - run:
          name: Broker integration against real RabbitMQ and Redis
          no_output_timeout: 15m
          command: bun run smoke:message-mediator
      - run:
          name: Container logs for a failed run
          when: on_fail
          command: docker ps -a && docker compose ls || true

workflows:
  continuous-integration:
    jobs:
      - branch-gate
      - workspace-builds:
          filters:
            branches:
              only:
                - dev
                - main
      - workspace-tests:
          filters:
            branches:
              only:
                - dev
                - main
      - integration:
          filters:
            branches:
              only:
                - dev
                - main
      - coverage:
          filters:
            branches:
              only:
                - dev
                - main
      - website:
          filters:
            branches:
              only:
                - dev
                - main
      - third-party-review
      - database-matrix:
          filters:
            branches:
              only:
                - dev
                - main
