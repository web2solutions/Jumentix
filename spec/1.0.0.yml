      type: object
      required:
        - data
        - type
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - CPF
            - RG
            - SSN
            - passport
          example: CPF
          description: Type of document
        countryIssue:
          type: string
          pattern: '^[A-Z]{2}$'
          maxLength: 2
          example: BR
          description: Country which emitted the document
        data:
          type: string
          maxLength: 20
          x-validation:
            description: Format rules per document type and issuing country. CPF uses the modulo-11 checksum with two verification digits; SSN uses the US AAA-GG-SSSS layout.
            rules:
              - when: { type: CPF, countryIssue: BR }
                pattern: '^\d{3}\.?\d{3}\.?\d{3}-?\d{2}$'
                mask: '000.000.000-00'
                checksum: cpf-mod11
                example: '123.456.789-09'
              - when: { type: SSN, countryIssue: US }
                pattern: '^\d{3}-?\d{2}-?\d{4}$'
                mask: '000-00-0000'
                example: '123-45-6789'
              - when: { type: RG }
                pattern: '^[A-Za-z0-9.-]{4,20}$'
              - when: { type: passport }
                pattern: '^[A-Za-z0-9]{5,20}$'
