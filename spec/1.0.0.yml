            description: National number format per country (countryCode selects the rule).
            rules:
              - when: { countryCode: '+55' }
                pattern: '^\d{4,5}-?\d{4}$'
                mask: '00000-0000'
                example: '99805-4033'
              - when: { countryCode: '+1' }
                pattern: '^\d{3}-?\d{4}$'
                mask: '000-0000'
                example: '555-0100'
