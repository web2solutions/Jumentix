<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Cana worker model</title>
  <desc id="desc">A visual flow from UI components to framework state, Cana client, optional worker, IndexedDB, and committed events returning to state.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Cana: durable state with a small database shape</text>
  <text x="60" y="96" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#475569">The UI renders from framework state. Cana commits data, then sends events back.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="160" width="180" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="90" y="205" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">UI</text>
    <text x="90" y="232" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#475569">React or Vue</text>

    <rect x="310" y="160" width="210" height="120" rx="14" fill="#ffffff" stroke="#93c5fd"/>
    <text x="342" y="205" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">State store</text>
    <text x="342" y="232" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#475569">Context, Redux, Pinia</text>

    <rect x="590" y="160" width="180" height="120" rx="14" fill="#ffffff" stroke="#86efac"/>
    <text x="622" y="205" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#15803d">Cana client</text>
    <text x="622" y="232" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#475569">typed tables</text>

    <rect x="840" y="120" width="230" height="200" rx="18" fill="#fff7ed" stroke="#fdba74"/>
    <text x="880" y="168" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#c2410c">Optional worker</text>
    <text x="880" y="196" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#475569">MessagePort boundary</text>
    <text x="880" y="222" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#475569">requestId per call</text>
    <text x="880" y="248" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#475569">plain data messages</text>

    <rect x="590" y="360" width="180" height="92" rx="14" fill="#ffffff" stroke="#a78bfa"/>
    <text x="622" y="397" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#6d28d9">IndexedDB</text>
    <text x="622" y="424" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#475569">durable commit</text>

    <rect x="310" y="360" width="210" height="92" rx="14" fill="#ffffff" stroke="#fca5a5"/>
    <text x="342" y="397" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#b91c1c">Change events</text>
    <text x="342" y="424" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#475569">created, updated, deleted</text>
  </g>

  <path d="M 240 220 L 300 220" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 520 220 L 580 220" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 770 220 L 830 220" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 680 280 L 680 350" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 590 406 L 530 406" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 415 360 L 415 292 C 415 292 415 292 415 292" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="60" y="338" width="180" height="50" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="88" y="370" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#075985">Components never wait on raw IDB events</text>
  </g>
</svg>
