services:
  mongodb:
    image: mongo:7
    container_name: aaa-mongodb
    ports:
      - '27027:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  mongodb_data:
