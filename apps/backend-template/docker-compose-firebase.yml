services:
  firebase-emulator:
    image: andreysenov/firebase-tools:latest
    container_name: aaa-firebase-emulator
    # `--host` is not a flag the firebase CLI accepts, and it never was here:
    # the container exited 1 on every run with "unknown option '--host'", so
    # the Firebase smoke has never met an emulator (JUM-620, same class as the
    # MSSQL password in JUM-598). The host belongs in a config file, which is
    # written inline so nothing has to be mounted.
    command: >
      sh -c "printf '%s' '{\"emulators\":{\"firestore\":{\"host\":\"0.0.0.0\",\"port\":8080}}}'
      > /home/node/firebase.json &&
      firebase setup:emulators:firestore &&
      firebase emulators:start --project demo-project --only firestore
      --config /home/node/firebase.json"
    ports:
      - '8080:8080'
      - '4000:4000'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:8080',r=>process.exit(0))
          .on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - firebase_data:/home/node/.cache

volumes:
  firebase_data:

