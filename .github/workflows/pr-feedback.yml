name: PR feedback trusted

on:
  pull_request_target:
    branches:
      - dev
      - main

env:
  BUN_VERSION: 1.3.13

jobs:
  pr-feedback-trusted:
    name: pr-feedback-trusted
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted PR base
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Bun
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bun-install.sh https://bun.sh/install
          bash /tmp/bun-install.sh "bun-v$BUN_VERSION"
          test -x "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Bootstrap trusted PR feedback checker
        run: |
          set -euo pipefail
          if [ -f ci-cd/check-pr-feedback.js ]; then
            exit 0
          fi
          if [ "${{ github.event.pull_request.base.ref }}" != "main" ] || [ "${{ github.event.pull_request.head.ref }}" != "dev" ]; then
            echo "The trusted PR feedback checker is absent from the base branch." >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin dev
          git checkout origin/dev -- ci-cd/check-pr-feedback.js ci-cd/lib/entry-point.js
      - name: Enforce resolved PR feedback
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun ci-cd/check-pr-feedback.js --repo "$GITHUB_REPOSITORY" --pr "${{ github.event.pull_request.number }}"
