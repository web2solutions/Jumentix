# JUM-917 / Req 070: production website must auto-deploy on every relevant
# change to `main`. Vercel Git Integration owns the deploy; this workflow
# fail-closes if the Vercel production commit status does not succeed.
name: Website deploy verify

on:
  push:
    branches:
      - main
    paths:
      - 'apps/jumentix-website/**'
      - 'packages/*/docs/**'
      - 'packages/*/README.md'
      - 'packages/*/README.pt-BR.md'
      - 'packages/*/media/**'
      - 'documentation/**'
  workflow_dispatch:

concurrency:
  group: website-deploy-verify-main
  cancel-in-progress: false

permissions:
  contents: read
  statuses: read

jobs:
  verify-production-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout commit for path inspection
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Wait for Vercel production status on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Vercel Root Directory is apps/jumentix-website. Upstream docs/media
          # path filters still run this job (Req 070 content surface), but a
          # missing Vercel status is only a failure when that root actually
          # changed — otherwise Vercel correctly skips and we must not fail closed.
          #
          # Prefer the push range (before..sha) so multi-commit pushes and merge
          # commits are covered; fall back to diff-tree -m for the tip alone.
          if [ -n "${BEFORE:-}" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed_paths="$(git diff --name-only "$BEFORE" "$SHA")"
          else
            changed_paths="$(git diff-tree --no-commit-id --name-only -r -m "$SHA")"
          fi
          website_touched="$(printf '%s\n' "$changed_paths" | awk '
            $0 ~ /^apps\/jumentix-website\// { found=1 }
            END { print found ? "yes" : "no" }
          ')"
          echo "website_touched=$website_touched"
          deadline=$((SECONDS + 1500))
          while :; do
            payload="$(gh api "repos/$REPO/commits/$SHA/status")"
            state="$(jq -r '.state // "pending"' <<<"$payload")"
            vercel="$(jq -r '
              [.statuses[]? | select(.context == "Vercel")]
              | if length == 0 then "missing"
                else .[0].state end
            ' <<<"$payload")"
            echo "combined=$state vercel=$vercel"
            case "$vercel" in
              success)
                echo "Vercel production/preview status succeeded for $SHA."
                exit 0
                ;;
              failure|error)
                echo "Vercel deployment failed for $SHA." >&2
                jq -r '.statuses[]? | select(.context == "Vercel") | .description, .target_url' <<<"$payload" >&2
                exit 1
                ;;
            esac
            if [ "$SECONDS" -gt "$deadline" ]; then
              if [ "$website_touched" = "no" ] && [ "$vercel" = "missing" ]; then
                echo "No apps/jumentix-website changes in push range for $SHA; missing Vercel status is an expected skip."
                exit 0
              fi
              echo "Timed out waiting for Vercel status on $SHA (last vercel=$vercel, website_touched=$website_touched)." >&2
              exit 1
            fi
            sleep 20
          done
