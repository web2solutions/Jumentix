name: Jumentix website quality

on:
  push:
    paths:
      - "apps/jumentix-website/**"
      - ".github/workflows/website.yml"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - "apps/jumentix-website/**"
      - ".github/workflows/website.yml"
      - "package.json"
      - "bun.lock"

jobs:
  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Storybook
        run: bun run website:storybook:build
      - name: Validate Storybook inventory
        run: bun run website:storybook:smoke
      - name: Validate publishable website content
        run: bun run website:test:prepublish
