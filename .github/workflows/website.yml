name: Jumentix website quality

# No path filter, deliberately.
#
# `storybook` is a required status check on `dev` and `main`. A required check
# that runs for only some pull requests is not a weaker gate — it is a stuck one.
# GitHub waits for a context that will never report, so a pull request touching
# no website file sits blocked forever with nothing red to fix and nothing to
# re-run. That is exactly what happened to the change that removed this filter:
# every other check passed and the merge was refused with "the base branch policy
# prohibits the merge".
#
# The build takes about two minutes. Paying that on every pull request is cheaper
# than a required check whose absence is indistinguishable from "still running".
on:
  push:
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Storybook
        run: bun run website:storybook:build
      - name: Validate Storybook inventory
        run: bun run website:storybook:smoke
      - name: Validate publishable website content
        run: bun run website:test:prepublish
