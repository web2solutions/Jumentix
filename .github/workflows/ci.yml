name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

env:
  BUN_VERSION: 1.3.13
  JUMENTIX_CI_GATE_RESULT_FILE: artifacts/ci/branch-quality-gate.json
  JUMENTIX_CI_MATRIX_RESULT_FILE: artifacts/ci/full-test-matrix.json
  JUMENTIX_FULL_MATRIX_SKIP_CELLS: workspace-builds,workspace-tests,website-prepublish,integration

jobs:
  branch-gate:
    name: ${{ github.event_name == 'push' && github.ref_name != 'dev' && github.ref_name != 'main' && 'task-branch-push' || 'branch-gate' }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      AAA_JWT_TOKEN_SECRET_KEY: ci_jwt_secret_key
      JUMENTIX_TASK_TEST_MODE: range
      JUMENTIX_TASK_TEST_BASE: origin/dev
      GH_TOKEN: ${{ github.token }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Fetch branch references
        run: git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"
      - name: Install Bun
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bun-install.sh https://bun.sh/install
          bash /tmp/bun-install.sh "bun-v$BUN_VERSION"
          test -x "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Export pull request metadata
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            {
              echo "AAA_CI_IS_PULL_REQUEST=1"
              echo "JUMENTIX_CI_IS_PULL_REQUEST=1"
              echo "JUMENTIX_QUALITY_GATE_TARGET=${GITHUB_BASE_REF}"
              echo "JUMENTIX_PR_HEAD_REF=${GITHUB_HEAD_REF}"
              echo "JUMENTIX_PR_BASE_REF=${GITHUB_BASE_REF}"
              echo "AAA_PR_HEAD_REF=${GITHUB_HEAD_REF}"
              echo "AAA_PR_BASE_REF=${GITHUB_BASE_REF}"
              echo "JUMENTIX_PR_TITLE<<__JUMENTIX_TITLE__"
              jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH"
              echo "__JUMENTIX_TITLE__"
              echo "AAA_PR_TITLE<<__JUMENTIX_TITLE__"
              jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH"
              echo "__JUMENTIX_TITLE__"
              echo "JUMENTIX_PR_BODY<<__JUMENTIX_BODY__"
              jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH"
              echo "__JUMENTIX_BODY__"
              echo "AAA_PR_BODY<<__JUMENTIX_BODY__"
              jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH"
              echo "__JUMENTIX_BODY__"
            } >> "$GITHUB_ENV"
          else
            {
              echo "AAA_CI_IS_PULL_REQUEST=0"
              echo "JUMENTIX_CI_IS_PULL_REQUEST=0"
              echo "JUMENTIX_QUALITY_GATE_TARGET=${GITHUB_REF_NAME}"
              echo "JUMENTIX_PR_HEAD_REF=${GITHUB_REF_NAME}"
              echo "AAA_PR_HEAD_REF=${GITHUB_REF_NAME}"
            } >> "$GITHUB_ENV"
          fi
      - name: Install frozen dependencies
        run: |
          bun ci-cd/check-bun-version.js
          bun install --frozen-lockfile
          bun run compat:check-node-version
      - name: Install WebKit for browser-based integration tests
        run: |
          bun x playwright install webkit
          bun x playwright install-deps webkit
      - name: Install the Cypress binary for the browser-harness layer
        run: |
          bun x cypress install
          bun x cypress verify
      - name: Classify CI context
        run: node ci-cd/classify-ci-context.js --result-file artifacts/ci/ci-context.json --require-job branch-gate
      - name: Run canonical branch quality gate
        timeout-minutes: 30
        run: bun run ci:gate:branch
      - name: Upload branch gate evidence
        if: always()
        run: find artifacts/ci -maxdepth 2 -type f -print || true

  pr-feedback:
    name: pr-feedback
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted PR base
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Bun
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bun-install.sh https://bun.sh/install
          bash /tmp/bun-install.sh "bun-v$BUN_VERSION"
          test -x "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Bootstrap trusted PR feedback checker
        run: |
          set -euo pipefail
          if [ -f ci-cd/check-pr-feedback.js ]; then
            exit 0
          fi
          if [ "${{ github.event.pull_request.base.ref }}" != "main" ] || [ "${{ github.event.pull_request.head.ref }}" != "dev" ]; then
            echo "The trusted PR feedback checker is absent from the base branch." >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin dev
          git checkout origin/dev -- ci-cd/check-pr-feedback.js ci-cd/lib/entry-point.js
      - name: Enforce resolved PR feedback
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun ci-cd/check-pr-feedback.js --repo "$GITHUB_REPOSITORY" --pr "${{ github.event.pull_request.number }}"

  sync-changelog:
    name: sync-changelog
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: branch-gate
    # CHANGELOG_GH_TOKEN lives in the "secrets" environment (all bot tokens
    # were consolidated there); without this the job cannot see the secret
    # and degrades to the manual-instructions path.
    environment: secrets
    permissions:
      contents: write
      # gh pr create in the sync step needs PR creation rights on top of the
      # contents token (JUM-862 follow-up: "Resource not accessible by
      # integration (createPullRequest)").
      pull-requests: write
    concurrency:
      group: changelog-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current release branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Install Bun
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bun-install.sh https://bun.sh/install
          bash /tmp/bun-install.sh "bun-v$BUN_VERSION"
          test -x "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Synchronize generated changelog
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
          # Fine-grained PAT (contents rw + pull-requests rw, this repo only).
          # Required because PRs opened with GITHUB_TOKEN never trigger
          # pull_request_target workflows, and dev's protection requires their
          # contexts (pr-feedback, sonar-reliability) — a GITHUB_TOKEN PR can
          # never satisfy them (JUM-862 follow-up).
          CHANGELOG_GH_TOKEN: ${{ secrets.CHANGELOG_GH_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --ff-only origin/main
          bun run changelog:update
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already current."
            exit 0
          fi
          # Branch protection rejects direct pushes to main (GH006), and
          # allow_auto_merge is off — open a PR, wait out the required checks,
          # then squash-merge it. No [skip ci]: the checks must run.
          branch="chore/changelog-sync-${GITHUB_SHA:0:8}"
          git checkout -b "$branch"
          git add CHANGELOG.md
          git commit -m "chore: synchronize changelog"
          git push origin "$branch"
          if [ -z "${CHANGELOG_GH_TOKEN:-}" ]; then
            echo "Secret CHANGELOG_GH_TOKEN is not configured."
            echo "Branch $branch is pushed and current — open the PR manually:"
            echo "  gh pr create --base main --head $branch --title 'chore: synchronize changelog'"
            exit 1
          fi
          pr_url="$(GH_TOKEN="$CHANGELOG_GH_TOKEN" gh pr create --base main --head "$branch" \
            --title "chore: synchronize changelog" \
            --body "Generated changelog sync, opened automatically by the sync-changelog workflow. Drift fix for JUM-862.")"
          echo "Opened $pr_url"
          # Poll mergeability instead of 'gh pr checks --watch --fail-fast':
          # non-required checks (e.g. the code-scanning AI findings job) fail
          # on every PR and would abort the wait; what matters is that the
          # required contexts are green, which is what CLEAN/UNSTABLE mean.
          # UNKNOWN is GitHub lazily computing mergeability right after PR
          # creation — it is not an error, so it stays in the retry loop
          # (first live run aborted on it seconds after opening the PR).
          deadline=$((SECONDS + 3600))
          while :; do
            state="$(gh pr view "$pr_url" --json mergeStateStatus --jq .mergeStateStatus)"
            case "$state" in
              CLEAN|UNSTABLE|HAS_HOOKS) break ;;
              BLOCKED|UNKNOWN)
                if [ "$SECONDS" -gt "$deadline" ]; then
                  echo "Required checks did not pass within 60m on $pr_url (last state: $state) — leaving the PR open for manual handling."
                  exit 1
                fi
                sleep 30
                ;;
              *)
                echo "Unexpected merge state '$state' on $pr_url — leaving the PR open for manual handling."
                exit 1
                ;;
            esac
          done
          if ! gh pr merge "$pr_url" --squash --delete-branch; then
            echo "Merge failed on $pr_url — leaving the PR open for manual handling."
            exit 1
          fi

  third-party-review:
    name: third-party-review
    permissions:
      contents: read
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_name == 'main' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Fetch branch references
        run: git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"
      - name: Install pinned review tools
        run: |
          ci-cd/install-pinned-review-tools.sh "$HOME/review-tools"
      - name: Scan Git history for secrets
        run: |
          set +e
          BASE_REF="${GITHUB_BASE_REF:-dev}"
          "$HOME/review-tools/gitleaks" git . \
            --log-opts="origin/${BASE_REF}..HEAD" \
            --redact --report-format sarif --report-path gitleaks.sarif
          echo "$?" > gitleaks.exit
      - name: Run repository-owned Semgrep policy
        run: |
          set +e
          BASE_REF="${GITHUB_BASE_REF:-dev}"
          "$HOME/review-tools/semgrep" scan --config .semgrep.yml --baseline-commit "origin/${BASE_REF}" \
            --sarif --output semgrep.sarif
          echo "$?" > semgrep.exit
      - name: List review evidence
        if: always()
        run: ls -lh gitleaks.sarif semgrep.sarif 2>/dev/null || true
      - name: Enforce scanner outcomes
        if: always()
        run: |
          test "$(cat gitleaks.exit)" = "0"
          test "$(cat semgrep.exit)" = "0"

  workspace-builds:
    name: workspace-builds
    permissions:
      contents: read
    # Intentional: release/main/scheduled only (Req 087/113). Task PRs to `dev`
    # and cheap `dev` pushes skip this job; `arch:check-workspace-boundaries`
    # and `build:dev` still fail closed as branch-gate preflight (JUM-786).
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'main' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' && (
        github.head_ref == 'dev' ||
        (startsWith(github.head_ref, 'codex/release/') && endsWith(github.head_ref, '-dev-main-signed-squash'))
      ))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Bun and dependencies
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bun-install.sh https://bun.sh/install
          bash /tmp/bun-install.sh "bun-v$BUN_VERSION"
          test -x "$HOME/.bun/bin/bun"
          export PATH="$HOME/.bun/bin:$PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" install --frozen-lockfile
      - name: Run workspace package builds
        timeout-minutes: 30
        run: bun run mono:build

  workspace-tests:
    name: workspace-tests
    permissions:
      contents: read
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'main' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' && (
        github.head_ref == 'dev' ||
        (startsWith(github.head_ref, 'codex/release/') && endsWith(github.head_ref, '-dev-main-signed-squash'))
      ))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Bun and dependencies
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bun-install.sh https://bun.sh/install
          bash /tmp/bun-install.sh "bun-v$BUN_VERSION"
          test -x "$HOME/.bun/bin/bun"
          export PATH="$HOME/.bun/bin:$PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" install --frozen-lockfile
      - name: Run workspace package tests
        timeout-minutes: 30
        run: bun run mono:test
      - name: Upload workspace test evidence
        if: always()
        run: find artifacts/ci -maxdepth 2 -type f -print || true

  integration:
    name: integration
    permissions:
      contents: read
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'main' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' && (
        github.head_ref == 'dev' ||
        (startsWith(github.head_ref, 'codex/release/') && endsWith(github.head_ref, '-dev-main-signed-squash'))
      ))
    runs-on: ubuntu-latest
    env:
      AAA_JWT_TOKEN_SECRET_KEY: ci_jwt_secret_key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Bun and dependencies
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bun-install.sh https://bun.sh/install
          bash /tmp/bun-install.sh "bun-v$BUN_VERSION"
          test -x "$HOME/.bun/bin/bun"
          export PATH="$HOME/.bun/bin:$PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" install --frozen-lockfile
      - name: Start Redis and RabbitMQ containers
        run: ci-cd/ensure-local-ci-services.sh
      - name: Install WebKit for browser-based integration tests
        run: |
          bun x playwright install webkit
          bun x playwright install-deps webkit
      - name: Run integration matrix
        timeout-minutes: 30
        run: bun run ci:integration
      - name: Stop local integration services
        if: always()
        run: ci-cd/cleanup-local-ci-services.sh

  coverage:
    name: coverage
    environment: env vars
    permissions:
      contents: read
    # Coverage + Codecov + Sonar analyse both long-lived branches (`main` and
    # `dev`). Other heavy jobs stay release/main/scheduled only (Req 087/113).
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'main' ||
      github.ref_name == 'dev' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' && (
        github.head_ref == 'dev' ||
        (startsWith(github.head_ref, 'codex/release/') && endsWith(github.head_ref, '-dev-main-signed-squash'))
      ))
    runs-on: ubuntu-latest
    env:
      AAA_JWT_TOKEN_SECRET_KEY: ci_jwt_secret_key
      AAA_REDIS_HOST: 127.0.0.1
      AAA_REDIS_PORT: '6379'
      AAA_BULLMQ_REDIS_HOST: 127.0.0.1
      AAA_BULLMQ_REDIS_PORT: '6379'
      AAA_RABBITMQ_URL: amqp://127.0.0.1:5672
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch branch references for patch coverage
        run: git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Bun and dependencies
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bun-install.sh https://bun.sh/install
          bash /tmp/bun-install.sh "bun-v$BUN_VERSION"
          test -x "$HOME/.bun/bin/bun"
          export PATH="$HOME/.bun/bin:$PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" install --frozen-lockfile
      - name: Start Redis and RabbitMQ containers
        run: ci-cd/ensure-local-ci-services.sh
      - name: Produce Jest coverage
        run: |
          bun run test:coverage
          mkdir -p coverage/jest
          cp coverage/coverage-final.json coverage/jest/coverage-final.json
      - name: Produce browser coverage for every supported engine
        run: |
          set -euo pipefail
          bun x cypress install
          bun x cypress verify
          for engine in chrome firefox webkit; do
            if [ "$engine" = webkit ]; then
              bun x playwright install webkit
              bun x playwright install-deps webkit
            fi
            bun packages/cana/scripts/run-browser-tests.js --browser "$engine"
            bun packages/cana/scripts/write-browser-lcov.js
            mkdir -p "coverage/browser-$engine"
            cp coverage/browser/coverage-final.json "coverage/browser-$engine/coverage-final.json"
            cp coverage/browser/lcov.info "coverage/browser-$engine/lcov.info"
          done
      - name: Union browser coverage engines
        run: |
          bun packages/cana/scripts/merge-browser-coverage.js --from-dir coverage
      - name: Enforce full coverage thresholds
        run: bun run coverage:check
      - name: Build workspace package dependencies for frontend coverage
        run: bun run mono:build
      - name: Produce frontend coverage for the patch report
        if: github.event_name == 'pull_request'
        run: bun run frontend:test:coverage
      - name: Enforce patch coverage
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            bun run coverage:merge
            bun run coverage:patch
          else
            echo "Patch coverage is PR-only; project coverage already passed."
          fi
      - name: Upload coverage reports to Codecov
        # codecov/codecov-action@v5, pinned to the peeled tag commit for Sonar/GitHub Actions supply-chain policy.
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: web2solutions/Jumentix
          files: coverage/lcov.info,coverage/browser/lcov.info
          flags: project
          name: jumentix-${{ github.ref_name }}-${{ github.run_id }}
          fail_ci_if_error: true
          disable_search: true
      - name: Verify Codecov public coverage reports
        env:
          CODECOV_BRANCH: ${{ github.ref_name }}
        run: bun ci-cd/verify-codecov-public-reports.js
      - name: Install Sonar scanner
        # SonarCloud Automatic Analysis owns the repository check by default.
        # Enable this CI scanner only after disabling Automatic Analysis in SonarCloud.
        if: vars.JUMENTIX_ENABLE_SONAR == 'true'
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) sonar_platform="macosx-aarch64" ;;
            Darwin-x86_64) sonar_platform="macosx-x64" ;;
            Linux-x86_64) sonar_platform="linux-x64" ;;
            *) echo "Unsupported Sonar scanner platform: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          sonar_version="7.1.0.4889"
          sonar_dir="/tmp/sonar-scanner-${sonar_version}-${sonar_platform}"
          rm -rf "$sonar_dir" /tmp/sonar-scanner.zip
          curl -fsSL -o /tmp/sonar-scanner.zip \
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${sonar_version}-${sonar_platform}.zip"
          unzip -qo /tmp/sonar-scanner.zip -d /tmp
          echo "${sonar_dir}/bin" >> "$GITHUB_PATH"
      - name: SonarQube Cloud Scan
        if: vars.JUMENTIX_ENABLE_SONAR == 'true'
        run: |
          # Analyse both long-lived branches. On PRs, GITHUB_BASE_REF is the
          # destination; on pushes it is empty and GITHUB_REF_NAME is the branch.
          SONAR_TARGET_BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF_NAME:-}}"
          if [ "$SONAR_TARGET_BRANCH" != "main" ] && [ "$SONAR_TARGET_BRANCH" != "dev" ]; then
            echo "Skipping Sonar for ${SONAR_TARGET_BRANCH:-unknown}; Sonar analyses main and dev only."
            exit 0
          fi
          test -n "${SONAR_TOKEN:-}"
          sonar-scanner -Dsonar.scm.disabled=true
      - name: Report Sonar findings
        if: vars.JUMENTIX_ENABLE_SONAR == 'true'
        run: bun ci-cd/report-sonar-findings.js
      - name: Enforce SonarCloud reliability A
        # On pushes the just-uploaded branch analysis is the right subject. On a
        # dev->main promotion PR the scanner submits a pull request analysis,
        # which never refreshes the target branch measures — the base branch
        # rating would be whatever the last merged main analysis left behind
        # (stale, and blocking even when the promotion carries every fix). The
        # head branch was analyzed on its push to dev and is the exact code the
        # promotion ships, so promotion PRs enforce against the head branch.
        if: >-
          vars.JUMENTIX_ENABLE_SONAR == 'true' &&
          (github.ref_name == 'main' || github.ref_name == 'dev' ||
          (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev'))
        env:
          SONAR_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bun run sonar:check-reliability
      - name: Stop local coverage services
        if: always()
        run: ci-cd/cleanup-local-ci-services.sh
      - name: Upload coverage evidence
        if: always()
        run: find coverage -maxdepth 3 -type f -print || true

  website:
    name: website
    permissions:
      contents: read
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'main' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' && (
        github.head_ref == 'dev' ||
        (startsWith(github.head_ref, 'codex/release/') && endsWith(github.head_ref, '-dev-main-signed-squash'))
      ))
    runs-on: ubuntu-latest
    env:
      JUMENTIX_WEBSITE_CYPRESS_SKIP_BUILD: '1'
      JUMENTIX_WEBSITE_CYPRESS_BROWSER: chrome
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Bun and dependencies
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bun-install.sh https://bun.sh/install
          bash /tmp/bun-install.sh "bun-v$BUN_VERSION"
          test -x "$HOME/.bun/bin/bun"
          export PATH="$HOME/.bun/bin:$PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" install --frozen-lockfile
      - name: Build Storybook
        run: bun run website:storybook:build
      - name: Validate Storybook inventory
        run: bun run website:storybook:smoke
      - name: Validate publishable website content
        run: bun run website:test:prepublish
      - name: Jest component, accessibility, and link quality gates
        run: bun run website:test:unit
      - name: Install Cypress binary
        run: bun x cypress install
      - name: Cypress website quality gates
        run: bun run website:test:cypress

  database-matrix:
    name: database-matrix
    permissions:
      contents: read
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'main' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' && (
        github.head_ref == 'dev' ||
        (startsWith(github.head_ref, 'codex/release/') && endsWith(github.head_ref, '-dev-main-signed-squash'))
      ))
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Bun and dependencies
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bun-install.sh https://bun.sh/install
          bash /tmp/bun-install.sh "bun-v$BUN_VERSION"
          test -x "$HOME/.bun/bin/bun"
          export PATH="$HOME/.bun/bin:$PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" install --frozen-lockfile
      - name: Build workspace package dependencies
        run: bun run mono:build
      - name: Ensure Docker runtime
        run: ci-cd/ensure-docker-runtime.sh
      - name: Database driver smoke matrix against real containers
        timeout-minutes: 45
        run: bun run test:smoke:db:all
      - name: Redis key-value integration against a real server
        timeout-minutes: 15
        run: bun run smoke:key-value:redis
      - name: Dead-letter queue integration against a real Redis
        timeout-minutes: 15
        run: bun run smoke:dead-letter:redis
      - name: Broker integration against real RabbitMQ and Redis
        timeout-minutes: 15
        run: bun run smoke:message-mediator
      - name: External repository adapters against Cassandra and MongoDB
        timeout-minutes: 20
        run: bun run smoke:db-repositories
      - name: Container logs for a failed run
        if: failure()
        run: docker ps -a && docker compose ls || true
