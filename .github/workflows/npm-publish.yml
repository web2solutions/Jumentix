name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release cohort to publish after the artifact gate passes
        required: true
        default: all
        type: choice
        options:
          - all
          - designer-core
          - cana
          - runtime
          - sdks
          - cli-init

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: secrets
    permissions:
      contents: read
      # Root .npmrc sets provenance=true; npm publish needs OIDC in GHA.
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.13"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Verify npm org access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_CI_CD }}
        run: bun run npm:org:check:jumentix
      - name: Validate public package artifacts
        run: bun run npm:packages:check
      - name: Publish selected release cohort
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_CI_CD }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          publish() {
            (cd "packages/$1" && npm publish --access public)
          }
          case "$RELEASE" in
            all)
              publish cana
              publish cana-react
              publish cana-vue
              publish designer-core
              publish persistence-contracts
              publish shared-contracts
              publish external-persistence-core
              publish external-store-proxy
              publish external-db-repositories
              publish key-value-storage
              publish database-client-factory
              publish message-mediator
              publish mutex-service
              publish dead-letter-queue
              publish runtime-infra
              publish adapter-runtime-bootstrap
              publish sdk-grpc-client
              publish sdk-rest-client
              publish sdk-websocket-client
              publish cli-init
              ;;
            cana)
              publish cana
              publish cana-react
              publish cana-vue
              ;;
            designer-core)
              publish designer-core
              ;;
            runtime)
              publish persistence-contracts
              publish shared-contracts
              publish external-persistence-core
              publish external-store-proxy
              publish external-db-repositories
              publish key-value-storage
              publish database-client-factory
              publish message-mediator
              publish mutex-service
              publish dead-letter-queue
              publish runtime-infra
              publish adapter-runtime-bootstrap
              ;;
            sdks)
              publish shared-contracts
              publish sdk-grpc-client
              publish sdk-rest-client
              publish sdk-websocket-client
              ;;
            cli-init)
              publish cli-init
              ;;
            *)
              echo "Unsupported release cohort: $RELEASE" >&2
              exit 1
              ;;
          esac
