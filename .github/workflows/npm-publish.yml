name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release cohort to publish after the artifact gate passes
        required: true
        default: all
        type: choice
        options:
          - all
          - designer-core
          - cana

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.13"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Validate public package artifacts
        run: bun run npm:packages:check
      - name: Publish selected release cohort
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_JUMENTIX_CI_CD }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          publish() {
            (cd "packages/$1" && npm publish --access public)
          }
          case "$RELEASE" in
            all)
              publish cana
              publish cana-react
              publish cana-vue
              publish designer-core
              ;;
            cana)
              publish cana
              ;;
            designer-core)
              publish designer-core
              ;;
            *)
              echo "Unsupported release cohort: $RELEASE" >&2
              exit 1
              ;;
          esac
