name: Publish npm packages

# Automated since JUM-894 (Req 070 amendment 2026-09-26): app-release.yml calls
# this workflow after every application release on main, publishing each public
# package whose package.json version is not yet on npm. Already-published
# versions are skipped (tag or registry check), so the call is idempotent.
# workflow_dispatch stays available for a manual cohort re-run.
on:
  workflow_call:
    inputs:
      release:
        description: Release cohort to publish
        required: false
        default: all
        type: string
  workflow_dispatch:
    inputs:
      release:
        description: Release cohort to publish after the artifact gate passes
        required: true
        default: all
        type: choice
        options:
          - all
          - designer-core
          - cana
          - runtime
          - sdks
          - cli-init

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: secrets
    permissions:
      # Package tags are pushed after a successful publish (JUM-886).
      contents: write
      # Root .npmrc sets provenance=true; npm publish needs OIDC in GHA.
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.13"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Configure git identity for package tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verify npm org access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_CI_CD }}
        run: bun run npm:org:check:jumentix
      - name: Validate public package artifacts
        run: bun run npm:packages:check
      - name: Publish selected release cohort
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_CI_CD }}
          RELEASE: ${{ inputs.release }}
        run: bun run release:publish-cohort "$RELEASE"
