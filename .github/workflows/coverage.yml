name: Repository-owned coverage

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: coverage (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The matrix is engines, not brands (JUM-417): chrome is the Chromium
        # engine (Chrome/Edge/Brave), firefox is the independent Gecko
        # IndexedDB, webkit is Playwright's build of Safari's engine.
        browser: [chrome, firefox, webkit]
    services:
      # Real Redis for key-value + BullMQ adapters (Req 118). No requirepass so
      # AAA_REDIS_PASSWORD stays unset and the client connects without a secret
      # embedded in the workflow. Only the chrome leg runs the Jest suite, but
      # declaring the services per-leg keeps the matrix a single shape.
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js 22 compatibility runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 (node24)
        with:
          bun-version: "1.3.14"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Assert the Node.js 22 compatibility contract
        run: bun run compat:check-node-version
      - name: Produce Jest coverage (unit + real Redis/broker integration)
        if: matrix.browser == 'chrome'
        run: bun run test:coverage
        env:
          AAA_JWT_TOKEN_SECRET_KEY: ${{ secrets.AAA_JWT_TOKEN_SECRET_KEY || 'ci_jwt_secret_key' }}
          # Measure RedisKeyValueStorageClient and Bull/Rabbit adapters under the
          # Jest instrument against real services — no istanbul ignore (Req 110/118).
          RUN_REDIS_INTEGRATION: "1"
          RUN_BROKER_INTEGRATION: "1"
          AAA_REDIS_HOST: 127.0.0.1
          AAA_REDIS_PORT: "6379"
          AAA_BULLMQ_REDIS_HOST: 127.0.0.1
          AAA_BULLMQ_REDIS_PORT: "6379"
          AAA_RABBITMQ_URL: amqp://127.0.0.1:5672
      - name: Install WebKit system dependencies
        if: matrix.browser == 'webkit'
        run: bunx playwright install-deps webkit
      - name: Produce browser coverage for packages/cana (Req 112 §4, engine ${{ matrix.browser }})
        run: bun ci-cd/run-browser-tests.js --browser ${{ matrix.browser }}
      - name: Write browser LCOV for Sonar (no Sonar coverage exclusion for cana)
        run: bun ci-cd/write-browser-lcov.js
      - name: Upload per-engine browser evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-coverage-${{ matrix.browser }}-${{ github.sha }}
          path: |
            coverage/browser/
            artifacts/ci/browser-matrix.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload immutable coverage evidence
        if: always() && matrix.browser == 'chrome'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage/coverage-final.json
            coverage/lcov.info
            coverage/browser/coverage-final.json
            coverage/browser/lcov.info
          if-no-files-found: error
          retention-days: 14

  coverage-gate:
    name: coverage gate (engine union)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # After every leg, not inside one: the threshold gate must grade the same
    # union Sonar does. A leg-local gate reads that leg's JSON alone, so a line
    # only WebKit exercises would read uncovered on the chrome leg and fail a
    # green matrix — and a chrome-only pass would never count the other
    # engines' hits. `merge-browser-coverage.js` builds the union here exactly
    # as it does in the Sonar workflow.
    needs: coverage
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The patch gate diffs against origin/main.
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Download every engine's browser evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: browser-coverage-*-${{ github.sha }}
          path: evidence
      - name: Download the Jest coverage evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-${{ github.sha }}
          path: evidence/jest
      - name: Union the engine reports and restore the Jest report
        run: |
          set -euo pipefail
          mkdir -p coverage
          cp "evidence/jest/coverage/coverage-final.json" coverage/coverage-final.json
          cp "evidence/jest/coverage/lcov.info" coverage/lcov.info
          for engine in chrome firefox webkit; do
            mkdir -p "coverage/browser-$engine"
            cp "evidence/browser-coverage-$engine-${{ github.sha }}/coverage/browser/coverage-final.json" \
              "coverage/browser-$engine/coverage-final.json"
            cp "evidence/browser-coverage-$engine-${{ github.sha }}/coverage/browser/lcov.info" \
              "coverage/browser-$engine/lcov.info"
          done
          bun ci-cd/merge-browser-coverage.js --from-dir coverage
      - name: Enforce all coverage metrics at 99/90/99/99
        run: bun run coverage:check
      - name: Enforce patch coverage
        if: github.event_name == 'pull_request'
        run: |
          bun run coverage:merge
          bun run coverage:patch
