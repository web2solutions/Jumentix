name: Repository-owned coverage

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      # Real Redis for key-value + BullMQ adapters (Req 118). No requirepass so
      # AAA_REDIS_PASSWORD stays unset and the client connects without a secret
      # embedded in the workflow.
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Produce Jest coverage (unit + real Redis/broker integration)
        run: bun run test:coverage
        env:
          AAA_JWT_TOKEN_SECRET_KEY: ${{ secrets.AAA_JWT_TOKEN_SECRET_KEY || 'ci_jwt_secret_key' }}
          # Measure RedisKeyValueStorageClient and Bull/Rabbit adapters under the
          # Jest instrument against real services — no istanbul ignore (Req 110/118).
          RUN_REDIS_INTEGRATION: "1"
          RUN_BROKER_INTEGRATION: "1"
          AAA_REDIS_HOST: 127.0.0.1
          AAA_REDIS_PORT: "6379"
          AAA_BULLMQ_REDIS_HOST: 127.0.0.1
          AAA_BULLMQ_REDIS_PORT: "6379"
          AAA_RABBITMQ_URL: amqp://127.0.0.1:5672
      - name: Produce browser coverage for packages/cana (Req 112 §4)
        run: bun run test:browser
      - name: Write browser LCOV for Sonar (no Sonar coverage exclusion for cana)
        run: bun ci-cd/write-browser-lcov.js
      - name: Enforce all coverage metrics at 99/90/99/99
        run: bun run coverage:check
      - name: Enforce patch coverage
        if: github.event_name == 'pull_request'
        run: bun run coverage:patch
      - name: Upload immutable coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage/coverage-final.json
            coverage/lcov.info
            coverage/browser/coverage-final.json
            coverage/browser/lcov.info
          if-no-files-found: error
          retention-days: 14
