name: Sonar reliability trusted

on:
  pull_request_target:
    branches:
      - dev
      - main

env:
  BUN_VERSION: 1.3.13

jobs:
  sonar-reliability-trusted:
    name: sonar-reliability-trusted
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted PR base
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Bun
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bun-install.sh https://bun.sh/install
          bash /tmp/bun-install.sh "bun-v$BUN_VERSION"
          test -x "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Await SonarCloud PR analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if bun run sonar:check-reliability; then
              exit 0
            fi
            if [ "$attempt" -eq 18 ]; then
              exit 1
            fi
            sleep 10
          done
