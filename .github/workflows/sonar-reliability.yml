name: Sonar reliability trusted

on:
  pull_request_target:
    branches:
      - dev
      - main

env:
  BUN_VERSION: 1.3.13

jobs:
  sonar-reliability:
    name: sonar-reliability
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted PR base
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Bun
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bun-install.sh https://bun.sh/install
          bash /tmp/bun-install.sh "bun-v$BUN_VERSION"
          test -x "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Checkout PR merge source for static analysis
        env:
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+refs/pull/${SONAR_PULL_REQUEST}/merge:refs/remotes/origin/sonar/pr/${SONAR_PULL_REQUEST}/merge"
          git worktree add --detach /tmp/jumentix-sonar-pr "refs/remotes/origin/sonar/pr/${SONAR_PULL_REQUEST}/merge"
          # The PR supplies source text only. The trusted base owns scanner policy.
          cp "$GITHUB_WORKSPACE/sonar-project.properties" /tmp/jumentix-sonar-pr/sonar-project.properties
      - name: Install Sonar scanner
        run: |
          set -euo pipefail
          sonar_version="7.1.0.4889"
          sonar_dir="/tmp/sonar-scanner-${sonar_version}-linux-x64"
          curl -fsSL -o /tmp/sonar-scanner.zip \
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${sonar_version}-linux-x64.zip"
          unzip -qo /tmp/sonar-scanner.zip -d /tmp
          test -x "${sonar_dir}/bin/sonar-scanner"
          echo "${sonar_dir}/bin" >> "$GITHUB_PATH"
      - name: Analyze PR reliability
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
          SONAR_PULL_REQUEST_BRANCH: ${{ github.event.pull_request.head.ref }}
          SONAR_PULL_REQUEST_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          cd /tmp/jumentix-sonar-pr
          sonar-scanner \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization=web2solutions \
            -Dsonar.projectKey=web2solutions_Jumentix \
            -Dsonar.pullrequest.key="$SONAR_PULL_REQUEST" \
            -Dsonar.pullrequest.branch="$SONAR_PULL_REQUEST_BRANCH" \
            -Dsonar.pullrequest.base="$SONAR_PULL_REQUEST_BASE"
      - name: Await SonarCloud PR analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if bun run sonar:check-reliability; then
              exit 0
            fi
            if [ "$attempt" -eq 18 ]; then
              exit 1
            fi
            sleep 10
          done
      - name: Remove PR analysis worktree
        if: always()
        run: git worktree remove --force /tmp/jumentix-sonar-pr || true
