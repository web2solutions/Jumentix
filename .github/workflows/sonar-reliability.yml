name: Sonar reliability

on:
  pull_request:
    branches:
      - dev
      - main

env:
  BUN_VERSION: 1.3.13

jobs:
  sonar-reliability:
    name: sonar-reliability
    permissions:
      contents: read
    # JUM-876 / Req 113: CircleCI's coverage job owns SonarCloud reliability
    # canonically (sonar:check-reliability). Retained but disabled by default;
    # re-enable with the repository variable JUMENTIX_ENABLE_GITHUB_ACTIONS_CI=true.
    if: vars.JUMENTIX_ENABLE_GITHUB_ACTIONS_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge result
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Bun
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bun-install.sh https://bun.sh/install
          bash /tmp/bun-install.sh "bun-v$BUN_VERSION"
          test -x "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install Sonar scanner
        run: |
          set -euo pipefail
          sonar_version="7.1.0.4889"
          sonar_dir="/tmp/sonar-scanner-${sonar_version}-linux-x64"
          curl -fsSL -o /tmp/sonar-scanner.zip \
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${sonar_version}-linux-x64.zip"
          unzip -qo /tmp/sonar-scanner.zip -d /tmp
          test -x "${sonar_dir}/bin/sonar-scanner"
          echo "${sonar_dir}/bin" >> "$GITHUB_PATH"
      - name: Analyze PR reliability
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
          SONAR_PULL_REQUEST_BRANCH: ${{ github.head_ref }}
          SONAR_PULL_REQUEST_BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          sonar-scanner \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization=web2solutions \
            -Dsonar.projectKey=web2solutions_Jumentix \
            -Dsonar.pullrequest.key="$SONAR_PULL_REQUEST" \
            -Dsonar.pullrequest.branch="$SONAR_PULL_REQUEST_BRANCH" \
            -Dsonar.pullrequest.base="$SONAR_PULL_REQUEST_BASE"
      - name: Await SonarCloud PR analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if bun run sonar:check-reliability; then
              exit 0
            fi
            if [ "$attempt" -eq 18 ]; then
              exit 1
            fi
            sleep 10
          done
