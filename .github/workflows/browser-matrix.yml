name: Browser matrix

on:
  pull_request:
    branches:
      - dev
      - main

env:
  BUN_VERSION: 1.3.13

jobs:
  browser-matrix:
    name: browser-matrix
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request merge result
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Bun and frozen dependencies
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bun-install.sh https://bun.sh/install
          bash /tmp/bun-install.sh "bun-v$BUN_VERSION"
          test -x "$HOME/.bun/bin/bun"
          export PATH="$HOME/.bun/bin:$PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" install --frozen-lockfile
      - name: Install browser engines
        run: |
          set -euo pipefail
          bun x cypress install
          bun x cypress verify
          bun x playwright install webkit
          bun x playwright install-deps webkit
      - name: Run Cana browser matrix
        timeout-minutes: 30
        run: |
          set -euo pipefail
          for engine in chrome firefox webkit; do
            bun packages/cana/scripts/run-browser-tests.js --browser "$engine"
          done
