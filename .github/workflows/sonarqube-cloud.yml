name: SonarQube Cloud

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "PR number to analyse/decorate when this is not a pull_request event"
        required: false
        type: string

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    # Same budget as Repository-owned coverage: Jest + real brokers + browser.
    timeout-minutes: 45
    services:
      # Same real services the coverage gate uses (Req 110/118). Without them
      # Redis/BullMQ/RabbitMQ adapters are unmeasured and the 99% gate fails
      # closed — which is correct, and which is why they are here rather than
      # re-ignored for Sonar.
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # So report-sonar-findings scopes to the PR on workflow_dispatch too.
      SONAR_PULL_REQUEST_KEY: ${{ github.event.pull_request.number || inputs.pull_request_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 compatibility runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert the Node.js 22 compatibility contract
        run: bun run compat:check-node-version

      - name: Produce Jest coverage (unit + real Redis/broker integration)
        run: bun run test:coverage
        env:
          AAA_JWT_TOKEN_SECRET_KEY: ${{ secrets.AAA_JWT_TOKEN_SECRET_KEY }}
          RUN_REDIS_INTEGRATION: "1"
          RUN_BROKER_INTEGRATION: "1"
          AAA_REDIS_HOST: 127.0.0.1
          AAA_REDIS_PORT: "6379"
          AAA_BULLMQ_REDIS_HOST: 127.0.0.1
          AAA_BULLMQ_REDIS_PORT: "6379"
          AAA_RABBITMQ_URL: amqp://127.0.0.1:5672

      - name: Produce browser coverage for packages/cana (Req 112 §4, engine chrome)
        run: bun ci-cd/run-browser-tests.js --browser chrome

      - name: Write browser LCOV for Sonar
        run: bun ci-cd/write-browser-lcov.js

      # The other engines ran in the coverage workflow; their LCOV rides in as
      # artifacts so Sonar sees the matrix union rather than one engine's view.
      - name: Fetch sibling engine coverage (firefox, webkit)
        uses: actions/download-artifact@018ca2d054dd1b3989d5ba1236e21043a7de8511 # v8.0.1
        with:
          pattern: browser-coverage-*-${{ github.sha }}
          path: /tmp/browser-engines

      - name: Merge every engine's browser LCOV into the canonical report
        run: bun ci-cd/merge-browser-coverage.js --from-dir /tmp/browser-engines

      # The authority on all four metrics, branches included (Requirement 110).
      # Fails closed when the browser report is missing (Req 112 §4 / 065).
      - name: Enforce coverage thresholds
        run: bun run coverage:check

      - name: Verify Sonar token
        run: test -n "$SONAR_TOKEN"

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        with:
          # pull_request events are auto-detected; workflow_dispatch needs the key
          # so Coverage on New Code / Security Rating decorate the open PR.
          args: >-
            ${{ (github.event.pull_request.number || inputs.pull_request_number) && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base=dev', github.event.pull_request.number || inputs.pull_request_number, github.head_ref || github.ref_name) || '' }}

      # A failed quality gate otherwise reports two letters and a link that needs a
      # SonarCloud session. Printing the findings keeps the failure diagnosable from
      # the log that reported it. Advisory: the gate blocks, this explains.
      - name: Report Sonar findings
        if: always()
        run: bun ci-cd/report-sonar-findings.js
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PULL_REQUEST_KEY: ${{ github.event.pull_request.number || inputs.pull_request_number }}
