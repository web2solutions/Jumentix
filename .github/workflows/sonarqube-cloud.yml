name: SonarQube Cloud

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests with coverage
        run: bun run test:coverage
        env:
          AAA_JWT_TOKEN_SECRET_KEY: ${{ secrets.AAA_JWT_TOKEN_SECRET_KEY }}
      # The authority on all four metrics, branches included (Requirement 110).
      # Bun emits no branch records, so this reads the Jest-produced lcov.
      - name: Enforce coverage thresholds
        run: bun run coverage:check

      - name: Verify Sonar token
        run: test -n "$SONAR_TOKEN"

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7

      # A failed quality gate otherwise reports two letters and a link that needs a
      # SonarCloud session. Printing the findings keeps the failure diagnosable from
      # the log that reported it. Advisory: the gate blocks, this explains.
      - name: Report Sonar findings
        if: always()
        run: bun ci-cd/report-sonar-findings.js
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
