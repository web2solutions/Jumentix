version: 2
updates:
  # Repo is Bun-managed (`bun.lock`); npm_and_yarn cannot update that lockfile.
  # https://github.com/web2solutions/Jumentix/security/dependabot/37
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 has no compiler API that typescript-eslint 8.72.1 can use.
      - dependency-name: typescript
        versions: ["7.x"]

  # Nested Vue template keeps its own npm lockfile outside the Bun workspace.
  - package-ecosystem: npm
    directory: /apps/frontend/template
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
